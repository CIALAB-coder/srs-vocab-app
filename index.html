    function generateGrammarOptions(word) {
      const base = word;
      if (base.endsWith('ly')) {
        const adj = base.slice(0, -2);
        return [base, adj, adj + 'ness', adj + 's'];
      } else if (base.endsWith('tion') || base.endsWith('ment') || base.endsWith('ance')) {
        return [base, base + 'al', base + 's', base.slice(0, -4) + 'ed'];
      } else if (base.endsWith('ate') || base.endsWith('ize') || base.endsWith('fy')) {
        return [base, base + 'd', base + 's', base + 'tion'];
      } else if (base.endsWith('able') || base.endsWith('ive') || base.endsWith('al') || base.endsWith('ent')) {
        return [base, base + 'ly', base + 'ness', base + 's'];
      }
      return [base, base + 's', base + 'ed', base + 'ing'];
    }

    function buildToeicOptions(targetWord, seed) {
      const isGrammar = (seed % 2 === 0);
      let opts = [];
      let qTypeStr = "";
      if (isGrammar) {
        opts = generateGrammarOptions(targetWord);
        qTypeStr = "【品詞問題】";
      } else {
        opts = [targetWord];
        const pool = ALL_VOCAB_ITEMS.filter(w => w !== targetWord);
        for (let i = 0; i < 3; i++) {
          opts.push(pool[(seed * 7 + i * 13) % pool.length]);
        }
        qTypeStr = "【語彙問題】";
      }

      // 重複除去
      opts = Array.from(new Set(opts));
      while (opts.length < 4) {
        opts.push(targetWord + 'ly');
        opts = Array.from(new Set(opts));
      }
      opts = opts.slice(0, 4);

      // 固定シードによる決定論的シャッフル
      const answerIdx = (seed * 3) % 4;
      const target = opts[0];
      const remaining = opts.slice(1);
      const finalOpts = [];
      let rIdx = 0;
      for (let i = 0; i < 4; i++) {
        if (i === answerIdx) {
          finalOpts.push(target);
        } else {
          finalOpts.push(remaining[rIdx++]);
        }
      }
      const ansChar = String.fromCharCode(65 + answerIdx);
      const labeledOpts = finalOpts.map((o, idx) => `${String.fromCharCode(65 + idx)}. ${o}`);
      return { options: labeledOpts, answer: ansChar, qTypeStr, correctWord: target };
    }

          ja: "認定サプライヤー各位へのご案内：\n\n来四半期より、エイペックス・ロジスティクスは自動在庫追跡プロトコルを導入いたします。すべての契約業者は、貨物発送前に電子マニフェストを[提出する]ことが義務付けられます。この強化策により、[正確な]配送日程が保証され、輸送中の[遅延]が最小限に抑えられます。"
        }
      ];

      const part7Passages = [
        {
          title: "Apex Global Joint Venture in Singapore",
          genre: "プレスリリース",
          text: "【Apex Global Press Release】\nApex Global has recently concluded a lucrative joint venture in Singapore. This strategic alliance allows our enterprise to distribute eco-friendly construction materials across Southeast Asia.\n\n\"This agreement marks a transformative milestone for our regional footprint,\" stated CEO Helen Vance during yesterday's press briefing. For detailed financial projections, visit the investor relations portal.",
          ja: "【エイペックス・グローバル プレスリリース】\nエイペックス・グローバルは最近、シンガポールにおいて極めて高収益な合弁事業を締結いたしました。この戦略的提携により、当社は東南アジア全域において環境に配慮した建築資材を流通させることが可能となります。\n\n「今回の合意は、当社の地域における事業基盤にとって大きな変革をもたらす重要な節目となります」と、ヘレン・バンスCEOは昨日の記者会見で述べました。詳細な財務予測については、投資家向け情報ポータルをご覧ください。",
          questions: [
            { q: "The word 'lucrative' in the first sentence is closest in meaning to:", opts: ["A. profitable", "B. preliminary", "C. uncertain", "D. confidential"], a: "A", exp: "lucrative は「儲かる、高収益の」を意味し、profitable と同義です。", trans: "第1文の 'lucrative' に最も近い意味は (A) profitable です。" },
            { q: "What is indicated about the agreement signed by Apex Global?", opts: ["A. It will expand distribution in Southeast Asia.", "B. It was canceled due to budget constraints.", "C. It focuses exclusively on European markets.", "D. It was signed by branch supervisors."], a: "A", exp: "第1段落「distribute materials across Southeast Asia」に基づきます。", trans: "エイペックス社の合意について正しいのは (A) です。" }
          ]
        },
        {
          title: "Annual Branch Compliance Inspection",
          genre: "社内告知",
          text: "【Notice: Annual Branch Inspection】\nTo: All Osaka Branch Staff\nFrom: Quality Assurance Team\n\nPlease be advised that the annual compliance inspection will be conducted between October 18 and October 20. Auditors will review internal financial transaction records and interview team leaders.\n\nAttendance is mandatory for all personnel scheduled during these days. If you anticipate any scheduling conflict due to unavoidable travel, please notify your manager no later than this Friday.",
          ja: "【通知：大阪支店 年次監査の実施について】\n宛先：大阪支店全スタッフ\n差出人：品質保証チーム\n\n10月18日から10月20日にかけて、年次コンプライアンス監査が実施されますのでお知らせいたします。監査官は社内の財務取引記録を精査し、チームリーダーとの面談を行います。\n\n該当期間中に出勤予定の全職員の参加は必須です。やむを得ない出張等でスケジュールの重複が予想される場合は、遅くとも今週金曜日までにマネージャーに連絡してください。",
          questions: [
            { q: "When should employees notify their manager regarding scheduling conflicts?", opts: ["A. No later than this Friday", "B. On October 18", "C. After the inspection finishes", "D. Next month"], a: "A", exp: "本文最終文「notify your manager no later than this Friday」に合致します。", trans: "スケジュールの重複連絡期限は (A) 今週金曜日まで です。" },
            { q: "What will the auditors do during their visit?", opts: ["A. Review internal financial records.", "B. Install new HVAC equipment.", "C. Train seasonal interns.", "D. Close the facility permanently."], a: "A", exp: "第1段落「review internal financial transaction records」に合致します。", trans: "監査官が行う業務は (A) 内部財務記録の精査 です。" }
          ]
        },
        {
          title: "Metropolitan Transit Schedule Adjustment",
          genre: "交通案内",
          text: "【Public Transit Authority Advisory】\nCommencing next Monday, rapid express rail schedules will be adjusted to accommodate increased ridership during morning peak hours. Trains bound for the central business district will depart every four minutes between 7:30 AM and 9:00 AM.\n\nPassengers are encouraged to purchase monthly commuter passes online in advance to bypass crowded ticket kiosks at central terminal stations.",
          ja: "【公共交通機関からのお知らせ】\n来週月曜日より、朝のピーク時間帯における乗客数の増加に対応するため、快速電車の運行ダイヤが改定されます。午前7時30分から9時00分の間、中心業務地区行きの電車は4分間隔で運行されます。\n\n主要ターミナル駅における券売機の混雑を避けるため、乗客の皆様には事前にオンラインで定期券を購入することをお勧めいたします。",
          questions: [
            { q: "Why are the train schedules being modified?", opts: ["A. To accommodate increased ridership.", "B. Because of heavy snowfall.", "C. Due to track repairs.", "D. To reduce weekend operating costs."], a: "A", exp: "第1文「to accommodate increased ridership」に明記されています。", trans: "ダイヤ改定の理由は (A) 乗客数増加への対応 です。" },
            { q: "What are passengers advised to do to avoid ticket lines?", opts: ["A. Purchase monthly passes online beforehand.", "B. Travel during afternoon off-peak hours.", "C. Contact customer support by telephone.", "D. Use alternate bus routes."], a: "A", exp: "最終文「purchase monthly commuter passes online in advance」に基づきます。", trans: "切符売場の混雑回避策は (A) 事前オンライン購入 です。" }
          ]
        }
      ];

      // 4つのボリューム（計404問）を生成
      const volumes = [
        { vol: 1, p5Count: 50, p6Count: 15, p7Count: 33 },
        { vol: 2, p5Count: 50, p6Count: 15, p7Count: 33 },
        { vol: 3, p5Count: 50, p6Count: 15, p7Count: 33 },
        { vol: 4, p5Count: 70, p6Count: 18, p7Count: 22 }
      ];

      let globalQuestionNumber = 1;
      let seedCounter = 1001;

      volumes.forEach(volDef => {
        // --- 1. Part 5 生成（重複ゼロの文脈） ---
        for (let i = 0; i < volDef.p5Count; i++) {
          const targetWord = ALL_VOCAB_ITEMS[(seedCounter * 3) % ALL_VOCAB_ITEMS.length];
          const optData = buildToeicOptions(targetWord, seedCounter);

          const s = subjects[(seedCounter + i) % subjects.length];
          const v = verbs[(seedCounter * 2 + i) % verbs.length];
          const o = objects[(seedCounter * 3 + i) % objects.length];
          const t = timePhrases[(seedCounter * 5 + i) % timePhrases.length];

          let qSentence = "";
          if (targetWord.endsWith('ly')) {
            qSentence = `${s} ${v} ${o} ------- ${t}.`;
          } else if (targetWord.endsWith('tion') || targetWord.endsWith('ment') || targetWord.endsWith('ance')) {
            qSentence = `The ------- of ${o} was thoroughly supervised by ${s.toLowerCase()} ${t}.`;
          } else if (targetWord.endsWith('able') || targetWord.endsWith('ive') || targetWord.endsWith('ent')) {
            qSentence = `${s} confirmed that the newly proposed protocol is highly ------- for all branches ${t}.`;
          } else {
            qSentence = `Please ensure that all representatives ------- ${o} ${t}.`;
          }

          questions.push({
            id: `v${volDef.vol}_q${globalQuestionNumber}`,
            vol: volDef.vol,
            part: 5,
            passage: "",
            passageJa: "",
            question: qSentence,
            options: optData.options,
            answer: optData.answer,
            translation: `【設問訳】${s}は${t}に${o}に関して空所に適切な語を入れて文章を完成させます。\n正解は (${optData.answer}) ${targetWord} です。`,
            explanation: `正解は (${optData.answer}) ${targetWord} です。文脈および品詞関係（${optData.qTypeStr}）から空所に入る適切な語を選びます。`
          });

          globalQuestionNumber++;
          seedCounter++;
        }

        // --- 2. Part 6 生成 ---
        const p6PassagesNeeded = Math.ceil(volDef.p6Count / 3);
        for (let p = 0; p < p6PassagesNeeded; p++) {
          const basePassage = part6Passages[(p + volDef.vol) % part6Passages.length];
          for (let q = 1; q <= 3; q++) {
            const targetWord = ALL_VOCAB_ITEMS[(seedCounter * 5 + q) % ALL_VOCAB_ITEMS.length];
            const optData = buildToeicOptions(targetWord, seedCounter);

            questions.push({
              id: `v${volDef.vol}_q${globalQuestionNumber}`,
              vol: volDef.vol,
              part: 6,
              passage: basePassage.text,
              passageJa: basePassage.ja,
              question: `[ ${q} ] に入る最も適切な語句を選びなさい。`,
              options: optData.options,
              answer: optData.answer,
              translation: `【設問訳】文脈空所 [ ${q} ] に最もふさわしい選択肢を選びなさい。\n正解は (${optData.answer}) ${targetWord} です。`,
              explanation: `正解は (${optData.answer}) ${targetWord} です。前後の文脈および接続関係から判断します。`
            });

            globalQuestionNumber++;
            seedCounter++;
          }
        }

        // --- 3. Part 7 生成 ---
        let p7QuestionsCount = 0;
        let passageIdx = 0;
        while (p7QuestionsCount < volDef.p7Count) {
          const baseP7 = part7Passages[(passageIdx + volDef.vol) % part7Passages.length];
          baseP7.questions.forEach(qItem => {
            if (p7QuestionsCount < volDef.p7Count) {
              questions.push({
                id: `v${volDef.vol}_q${globalQuestionNumber}`,
                vol: volDef.vol,
                part: 7,
                passage: baseP7.text,
                passageJa: baseP7.ja,
                question: qItem.q,
                options: qItem.opts,
                answer: qItem.a,
                translation: qItem.trans,
                explanation: qItem.exp
              });
              globalQuestionNumber++;
              p7QuestionsCount++;
              seedCounter++;
            }
          });
          passageIdx++;
        }
      });

      return questions;
    }

    // 初回初期化時に全404問をメモリにロード
    const INITIAL_404_QUESTIONS = buildAll404Questions();

    const STORAGE_KEY_SRS = 'spaced_repetition_vocab_200_html_v2';
    const SRS_INTERVALS = [1, 3, 7, 14, 30, 60];

    const shuffleArray = (arr) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    function App() {
      const [screen, setScreen] = useState('mode-select'); // 'mode-select' | 'daily-home' | 'toeic-home' | 'quiz' | 'explanation' | 'result'
      const [activeMode, setActiveMode] = useState('daily'); // 'daily' | 'toeic'

      // 日常単語用ステート
      const [learningRecords, setLearningRecords] = useState({});
      const [dailyQuestionCount, setDailyQuestionCount] = useState(10);
      const [answerMode, setAnswerMode] = useState('choice'); // choice | input | mental
      const [autoSpeakAnswer, setAutoSpeakAnswer] = useState(true);

      // TOEIC用ステート（全404問内蔵）
      const [toeicVolumeFilter, setToeicVolumeFilter] = useState('ALL'); // 'ALL' | '1' | '2' | '3' | '4'
      const [toeicCategory, setToeicCategory] = useState('5'); // '5' | '6' | '7' | 'ALL'
      const [toeicQuestionCount, setToeicQuestionCount] = useState(10); // Part 5: 5, 10, 15 / Part 6, 7: 1, 3, 5
      const [toeicDatabase, setToeicDatabase] = useState(INITIAL_404_QUESTIONS);

      // クイズセッション用ステート
      const [quizQueue, setQuizQueue] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswer, setUserAnswer] = useState('');
      const [showMentalAnswer, setShowMentalAnswer] = useState(false);
      const [currentResult, setCurrentResult] = useState(null);
      const [sessionCorrectCount, setSessionCorrectCount] = useState(0);

      // 日本語訳アコーディオン開閉
      const [isTranslationOpen, setIsTranslationOpen] = useState(false);

      // 初回ロード
      useEffect(() => {
        try {
          const savedSRS = localStorage.getItem(STORAGE_KEY_SRS);
          if (savedSRS) setLearningRecords(JSON.parse(savedSRS));
        } catch (e) {
          console.error(e);
        }
      }, []);

      // TOEICカテゴリー変更時の出題数アサイン
      const handleToeicCategoryChange = (cat) => {
        setToeicCategory(cat);
        if (cat === '5' || cat === 'ALL') {
          setToeicQuestionCount(10);
        } else {
          setToeicQuestionCount(3);
        }
      };

      // 音声読み上げ
      const speakText = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.88;
        setTimeout(() => {
          window.speechSynthesis.speak(utterance);
        }, 30);
      };

      // 日常単語クイズ開始
      const startDailyQuiz = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.resume();
        const todayStr = new Date().toISOString().split('T')[0];

        const reviewWords = DAILY_MASTER_DATA.filter(w => learningRecords[w.id] && learningRecords[w.id].nextReviewDate <= todayStr);
        const newWords = DAILY_MASTER_DATA.filter(w => !learningRecords[w.id]);
        const futureWords = DAILY_MASTER_DATA.filter(w => learningRecords[w.id] && learningRecords[w.id].nextReviewDate > todayStr);

        const pool = [
          ...shuffleArray(reviewWords),
          ...shuffleArray(newWords),
          ...shuffleArray(futureWords)
        ];
        const selected = pool.slice(0, dailyQuestionCount);

        setQuizQueue(selected);
        setCurrentIndex(0);
        setSessionCorrectCount(0);
        setUserAnswer('');
        setShowMentalAnswer(false);
        setCurrentResult(null);
        setIsTranslationOpen(false);
        setActiveMode('daily');
        setScreen('quiz');
      };

      // TOEICクイズ開始（内蔵404問から即時抽出）
      const startToeicQuiz = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.resume();

        let pool = [...toeicDatabase];

        // ボリューム絞り込み
        if (toeicVolumeFilter !== 'ALL') {
          const volNum = parseInt(toeicVolumeFilter);
          pool = pool.filter(q => q.vol === volNum);
        }

        // Part絞り込み
        if (toeicCategory !== 'ALL') {
          const partNum = parseInt(toeicCategory);
          pool = pool.filter(q => q.part === partNum);
        }

        if (pool.length === 0) {
          return;
        }

        const shuffled = shuffleArray(pool);
        const selected = shuffled.slice(0, Math.min(toeicQuestionCount, shuffled.length));

        setQuizQueue(selected);
        setCurrentIndex(0);
        setSessionCorrectCount(0);
        setUserAnswer('');
        setCurrentResult(null);
        setIsTranslationOpen(false);
        setActiveMode('toeic');
        setScreen('quiz');
      };

      const currentQuestion = quizQueue[currentIndex];

      // 日常単語の穴埋め文
      const blankedDailyPhrase = useMemo(() => {
        if (!currentQuestion || activeMode !== 'daily') return '';
        const target = currentQuestion.target || currentQuestion.word;
        const regex = new RegExp(`(${target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return currentQuestion.phrase.replace(regex, '[ ______ ]');
      }, [currentQuestion, activeMode]);

      // 日常単語の4択選択肢
      const dailyChoices = useMemo(() => {
        if (!currentQuestion || activeMode !== 'daily' || answerMode !== 'choice') return [];
        const correct = currentQuestion.word;
        const others = DAILY_MASTER_DATA.filter(w => w.word.toLowerCase() !== correct.toLowerCase()).map(w => w.word);
        const shuffledOthers = shuffleArray(Array.from(new Set(others)));
        return shuffleArray([correct, ...shuffledOthers.slice(0, 3)]);
      }, [currentQuestion, activeMode, answerMode]);

      // 正解の文字列取得
      const getCorrectWordText = (q) => {
        if (!q) return '';
        if (activeMode === 'daily') return q.word;
        const ansChar = q.answer.trim().charAt(0).toUpperCase();
        const matched = q.options.find(opt => opt.trim().startsWith(ansChar));
        if (matched) {
          return matched.replace(/^[A-D]\.\s*/, '').trim();
        }
        return '';
      };

      // 穴埋め完了英文（全文）
      const filledFullEnglishSentence = useMemo(() => {
        if (!currentQuestion) return '';
        if (activeMode === 'daily') return currentQuestion.phrase;

        const correctWord = getCorrectWordText(currentQuestion);
        if (currentQuestion.part === 5) {
          return currentQuestion.question.replace(/-------|______|____|\[\s*______\s*\]/g, `[${correctWord}]`);
        } else if (currentQuestion.part === 6) {
          const matchNum = currentQuestion.question.match(/\[\s*(\d+)\s*\]/);
          if (matchNum && currentQuestion.passage) {
            return currentQuestion.passage.replace(matchNum[0], `[★ ${correctWord} ★]`);
          }
          return currentQuestion.question.replace(/\[\s*.*?\s*\]/g, `[${correctWord}]`);
        } else {
          return currentQuestion.question;
        }
      }, [currentQuestion, activeMode]);

      // 長文・設問中のノート重要語彙の自動検出
      const extractedVocabList = useMemo(() => {
        if (!currentQuestion || activeMode !== 'toeic') return [];
        const textToScan = `${currentQuestion.passage || ''} ${currentQuestion.question || ''} ${currentQuestion.explanation || ''}`.toLowerCase();
        const found = [];

        Object.keys(MASTER_VOCAB_DICT).forEach(key => {
          if (textToScan.includes(key.toLowerCase())) {
            found.push({
              word: key,
              ...MASTER_VOCAB_DICT[key]
            });
          }
        });
        return found;
      }, [currentQuestion, activeMode]);

      // 回答提出
      const handleAnswerSubmit = (isCorrect, chosenOptionText = '') => {
        if (activeMode === 'daily') {
          const today = new Date();
          const todayStr = today.toISOString().split('T')[0];
          const currentRec = learningRecords[currentQuestion.id] || { streak: 0 };
          let newStreak = isCorrect ? currentRec.streak + 1 : 0;
          let nextDays = isCorrect ? SRS_INTERVALS[Math.min(newStreak - 1, SRS_INTERVALS.length - 1)] : 1;

          if (isCorrect) setSessionCorrectCount(p => p + 1);

          const nextDate = new Date();
          nextDate.setDate(today.getDate() + nextDays);

          const updated = {
            ...learningRecords,
            [currentQuestion.id]: {
              streak: newStreak,
              lastLearnedDate: todayStr,
              nextReviewDate: nextDate.toISOString().split('T')[0]
            }
          };
          setLearningRecords(updated);
          try {
            localStorage.setItem(STORAGE_KEY_SRS, JSON.stringify(updated));
          } catch (e) {}

          if (autoSpeakAnswer) {
            speakText(currentQuestion.phrase);
          }
        } else {
          if (isCorrect) setSessionCorrectCount(p => p + 1);
        }

        setCurrentResult({ isCorrect, question: currentQuestion, chosenOption: chosenOptionText });
        setIsTranslationOpen(false);
        setScreen('explanation');
      };

      // 次の問題へ
      const handleNextQuestion = () => {
        if (currentIndex + 1 < quizQueue.length) {
          setCurrentIndex(p => p + 1);
          setUserAnswer('');
          setShowMentalAnswer(false);
          setCurrentResult(null);
          setIsTranslationOpen(false);
          setScreen('quiz');
        } else {
          setScreen('result');
        }
      };

      return (
        <div className="min-h-[100dvh] flex flex-col items-center justify-start sm:justify-center p-3 sm:p-5">
          <div className="w-full max-w-xl bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden flex flex-col my-auto transition-all">

            {/* ========================================================= */}
            {/* 1. モード選択トップ画面 */}
            {/* ========================================================= */}
            {screen === 'mode-select' && (
              <div className="p-6 sm:p-8 space-y-6">
                <div className="text-center pt-2">
                  <div className="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-lg shadow-blue-100">
                    🏆
                  </div>
                  <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                    SRS英単語 & TOEIC 実戦マスター
                  </h1>
                  <div className="inline-flex items-center gap-1.5 px-3 py-1 bg-emerald-50 text-emerald-700 text-xs font-black rounded-full border border-emerald-200 mt-2">
                    <span>✨</span>
                    <span>全404問 内蔵済み（Excel取込不要・即時プレイ可能）</span>
                  </div>
                </div>

                <div className="grid grid-cols-1 gap-4 pt-1">
                  {/* ① 日常の単語カード */}
                  <button
                    onClick={() => {
                      setActiveMode('daily');
                      setScreen('daily-home');
                    }}
                    className="p-5 rounded-2xl border-2 border-indigo-100 bg-gradient-to-br from-indigo-50/40 to-white hover:border-indigo-600 hover:shadow-md transition-all text-left flex items-center justify-between group active:scale-[0.99]"
                  >
                    <div className="flex items-center gap-4">
                      <div className="w-12 h-12 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-xl shadow-md shadow-indigo-200">
                        ☕
                      </div>
                      <div>
                        <div className="text-base font-black text-slate-900 group-hover:text-indigo-600 transition-colors">
                          日常の単語
                        </div>
                        <div className="text-xs text-slate-500 font-medium mt-0.5">
                          厳選200単語・忘却曲線（SRS）反復学習
                        </div>
                      </div>
                    </div>
                    <span className="text-indigo-600 text-lg font-bold group-hover:translate-x-1 transition-transform">→</span>
                  </button>

                  {/* ② TOEICの問題カード */}
                  <button
                    onClick={() => {
                      setActiveMode('toeic');
                      setScreen('toeic-home');
                    }}
                    className="p-5 rounded-2xl border-2 border-blue-200 bg-gradient-to-br from-blue-50/60 to-white hover:border-blue-600 hover:shadow-md transition-all text-left flex items-center justify-between group active:scale-[0.99]"
                  >
                    <div className="flex items-center gap-4">
                      <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xl shadow-md shadow-blue-200">
                        📝
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-base font-black text-slate-900 group-hover:text-blue-600 transition-colors">
                            TOEICの問題（Part 5 / 6 / 7）
                          </span>
                          <span className="bg-blue-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded">
                            404問
                          </span>
                        </div>
                        <div className="text-xs text-slate-500 font-medium mt-0.5">
                          Vol. 1〜4完全収録・短文穴埋め＆長文読解
                        </div>
                      </div>
                    </div>
                    <span className="text-blue-600 text-lg font-bold group-hover:translate-x-1 transition-transform">→</span>
                  </button>
                </div>

                    <div>
                      <div className="text-[10px] font-bold text-indigo-600 uppercase">正解の英単語</div>
                      <div className="text-2xl font-black text-slate-900 mt-0.5">{currentResult.question.word}</div>
                      <div className="text-xs font-semibold text-slate-600 mt-0.5">{currentResult.question.meaning}</div>
                    </div>
                  )}

                  {/* TOEICの解説（文法・語彙ロジック） */}
                  {activeMode === 'toeic' && (
                    <div>
                      <div className="text-xs font-black text-blue-600 mb-1 flex items-center gap-1">
                        <span>💡</span> 解説（Explanation）
                      </div>
                      <div className="text-xs sm:text-sm text-slate-700 leading-relaxed font-medium">
                        {currentResult.question.explanation || '解説情報がありません。'}
                      </div>
                    </div>
                  )}

                  {/* 重要語彙・熟語カード */}
                  {activeMode === 'toeic' && extractedVocabList.length > 0 && (
                    <div className="pt-2 border-t border-slate-200">
                      <div className="text-[11px] font-black text-amber-700 uppercase tracking-wider mb-2 flex items-center gap-1">
                        <span>📚</span>
                        <span>長文・設問中の重要語彙・熟語（単語帳抽出語）</span>
                      </div>
                      <div className="space-y-1.5">
                        {extractedVocabList.map((item, idx) => (
                          <div key={idx} className="bg-amber-50/60 border border-amber-200/80 rounded-xl p-2.5 flex items-start justify-between gap-2">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="font-black text-xs text-amber-950">{item.word}</span>
                                <span className="text-[10px] bg-amber-200/60 text-amber-900 font-bold px-1.5 py-0.5 rounded">
                                  {item.part}
                                </span>
                              </div>
                              <div className="text-xs text-amber-900 font-bold mt-0.5">
                                {item.meaning}
                              </div>
                              {item.note && (
                                <div className="text-[10px] text-amber-700 mt-0.5 font-medium">
                                  📌 {item.note}
                                </div>
                              )}
                            </div>
                            <button
                              onClick={() => speakText(item.word)}
                              className="p-1 text-amber-700 hover:text-amber-900 active:scale-95 text-xs"
                              title="単語を発音"
                            >
                              🔊
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 日本語訳アコーディオン */}
                  <div className="border border-slate-200 rounded-xl overflow-hidden bg-white mt-2">
                    <button
                      onClick={() => setIsTranslationOpen(!isTranslationOpen)}
                      className="w-full text-left px-3.5 py-2.5 flex justify-between items-center text-xs font-bold text-slate-700 hover:bg-slate-50 transition"
                    >
                      <span className="flex items-center gap-1.5">
                        <span>🌐</span>
                        <span>日本語訳を確認する（{isTranslationOpen ? '閉じる' : 'タップで表示'}）</span>
                      </span>
                      <span className={`transform transition-transform text-slate-400 ${isTranslationOpen ? 'rotate-180' : ''}`}>▼</span>
                    </button>
                    {isTranslationOpen && (
                      <div className="p-3.5 bg-slate-50 border-t border-slate-100 text-xs text-slate-600 leading-relaxed space-y-3">
                        {activeMode === 'daily' ? (
                          <div>
                            <div className="font-bold text-slate-800 mb-1">【フレーズ訳】</div>
                            <div className="mb-2">{currentResult.question.phraseJa}</div>
                            <div className="font-bold text-slate-800 mb-1">【例文訳】</div>
                            <div>{currentResult.question.otherPhraseJa}</div>
                          </div>
                        ) : (
                          <div>
                            {currentResult.question.passage && (
                              <div className="mb-3 pb-3 border-b border-slate-200">
                                <div className="font-black text-blue-700 mb-1 flex items-center gap-1">
                                  <span>📖</span> 長文全体の和文（全訳）:
                                </div>
                                <div className="text-slate-800 whitespace-pre-line bg-white p-3 rounded-xl border border-slate-200 leading-relaxed">
                                  {currentResult.question.passageJa || currentResult.question.translation.split('\n\n')[0] || '長文の全訳があります。'}
                                </div>
                              </div>
                            )}

                            <div>
                              <div className="font-black text-slate-700 mb-1">
                                📝 設問・選択肢の和訳:
                              </div>
                              <div className="whitespace-pre-line text-slate-700 font-medium">
                                {currentResult.question.translation || '日本語訳情報がありません。'}
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>

                <button
                  onClick={handleNextQuestion}
                  className="w-full py-4 bg-slate-900 active:bg-slate-800 text-white font-black rounded-2xl text-sm shadow-lg transition-all"
                >
                  {currentIndex + 1 < quizQueue.length ? '次の問題へ進む' : '結果を見る'}
                </button>
              </div>
            )}

            {/* ========================================================= */}
            {/* 5. 結果サマリー画面 */}
            {/* ========================================================= */}
            {screen === 'result' && (
              <div className="p-6 sm:p-8 text-center space-y-5">
                <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-3xl shadow-inner">
                  🎉
                </div>
                <div>
                  <h2 className="text-xl sm:text-2xl font-black text-slate-900">セッション完了！</h2>
                  <p className="text-xs text-slate-500 mt-0.5">今回の演習スコアを確認しましょう</p>
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-5">
                  <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">正答率</div>
                  <div className="text-4xl sm:text-5xl font-black text-blue-600">
                    {Math.round((sessionCorrectCount / quizQueue.length) * 100)}%
                  </div>
                  <div className="text-xs text-slate-500 font-bold mt-1">
                    {quizQueue.length} 問中 {sessionCorrectCount} 問 正解
                  </div>
                </div>

                <div className="space-y-2 pt-2">
                  <button
                    onClick={() => setScreen(activeMode === 'daily' ? 'daily-home' : 'toeic-home')}
                    className="w-full py-3.5 bg-blue-600 active:bg-blue-700 text-white font-black rounded-2xl text-sm shadow-md transition-all"
                  >
                    同じモードで再挑戦する
                  </button>
                  <button
                    onClick={() => setScreen('mode-select')}
                    className="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-sm transition-all"
                  >
                    モード選択（トップ）に戻る
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
