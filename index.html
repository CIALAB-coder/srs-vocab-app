    const STORAGE_KEY = 'spaced_repetition_vocab_200_html_v2';
    const SRS_INTERVALS = [1, 3, 7, 14, 30, 60];

    const shuffleArray = (arr) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    function App() {
      const [learningRecords, setLearningRecords] = useState({});
      const [screen, setScreen] = useState('home'); // home | quiz | explanation | result
      const [questionCount, setQuestionCount] = useState(10);
      const [answerMode, setAnswerMode] = useState('choice'); // choice | input | mental
      const [autoSpeakAnswer, setAutoSpeakAnswer] = useState(true); // 回答後に自動で全文発音する設定

      const [quizQueue, setQuizQueue] = useState([]);

      const [showMentalAnswer, setShowMentalAnswer] = useState(false);
      const [currentResult, setCurrentResult] = useState(null);
      const [sessionCorrectCount, setSessionCorrectCount] = useState(0);

      // 初回ロード：LocalStorageから学習記録復元
      useEffect(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) setLearningRecords(JSON.parse(saved));
        } catch (e) {
          console.error('Failed to load localStorage', e);
        }
      }, []);

      // 今日の復習・新規単語数の算出
      const { reviewCount, newCount } = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        let review = 0;
        let fresh = 0;
        MASTER_DATA.forEach((item) => {
          const rec = learningRecords[item.id];
          if (!rec) fresh++;
          else if (rec.nextReviewDate <= todayStr) review++;
        });
        return { reviewCount: review, newCount: fresh };
      }, [learningRecords]);

      // Web Speech API 音声発音（iOS Safari向け安定化処理済み）
      const speakText = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.88; // 聞き取りやすい自然な速度
        // iOS Safari対策：わずかな遅延を挟んで再生キューを安定化
        setTimeout(() => {
          window.speechSynthesis.speak(utterance);
        }, 30);
      };

      // クイズ開始
      const startQuiz = () => {
        // iOS Safariの音声アンロック処理
        if ('speechSynthesis' in window) {
          window.speechSynthesis.resume();
        }

        const todayStr = new Date().toISOString().split('T')[0];
        // ① 今日復習すべき単語
        const reviewWords = MASTER_DATA.filter((w) => {
          const r = learningRecords[w.id];
          return r && r.nextReviewDate <= todayStr;
        });
        // ② 未学習の単語
        const newWords = MASTER_DATA.filter((w) => !learningRecords[w.id]);
        // ③ それでも足りない場合は次回予定日が先のものから補充
        const futureWords = MASTER_DATA.filter((w) => {
          const r = learningRecords[w.id];
          return r && r.nextReviewDate > todayStr;
        });

        const pool = [
          ...shuffleArray(reviewWords),
          ...shuffleArray(newWords),
          ...shuffleArray(futureWords)
        ];
        const selected = pool.slice(0, questionCount);

        setQuizQueue(selected);
        setCurrentIndex(0);
        setSessionCorrectCount(0);
        setUserAnswer('');
        setShowMentalAnswer(false);
        setCurrentResult(null);
        setScreen('quiz');
      };

      const currentQuestion = quizQueue[currentIndex];

      // 穴埋めテキストの生成
      const blankedPhrase = useMemo(() => {
        if (!currentQuestion) return '';
        const target = currentQuestion.target || currentQuestion.word;
        const regex = new RegExp(`(${target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return currentQuestion.phrase.replace(regex, '[ ______ ]');
      }, [currentQuestion]);

      // 4択用ダミー選択肢の生成
      const choices = useMemo(() => {
        if (!currentQuestion || answerMode !== 'choice') return [];
        const correct = currentQuestion.word;
        const others = MASTER_DATA.filter(
          (w) => w.word.toLowerCase() !== correct.toLowerCase()
        ).map((w) => w.word);
        const shuffledOthers = shuffleArray(Array.from(new Set(others)));
        return shuffleArray([correct, ...shuffledOthers.slice(0, 3)]);

      const handleAnswerSubmit = (isCorrect) => {
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];
        const currentRec = learningRecords[currentQuestion.id] || { streak: 0 };

        let newStreak = 0;
        let nextDays = 1;

        if (isCorrect) {
          newStreak = currentRec.streak + 1;
          const idx = Math.min(newStreak - 1, SRS_INTERVALS.length - 1);
          nextDays = SRS_INTERVALS[idx];
          setSessionCorrectCount((prev) => prev + 1);
        } else {
          newStreak = 0;
          nextDays = 1;
        }

        const nextDate = new Date();
        nextDate.setDate(today.getDate() + nextDays);

        const updated = {
          ...learningRecords,
          [currentQuestion.id]: {
            streak: newStreak,
            lastLearnedDate: todayStr,
            nextReviewDate: nextDate.toISOString().split('T')[0],
          },
        };

        setLearningRecords(updated);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(updated));
        } catch (e) {}

        setCurrentResult({ isCorrect, question: currentQuestion });
        setScreen('explanation');

        // ★回答後、即座に答えの英文フレーズ全文を自動で音声読み上げ★
        if (autoSpeakAnswer) {
          speakText(currentQuestion.phrase);
        }
      };

      // タイピング入力の正誤判定
      const handleInputSubmit = (e) => {
        e.preventDefault();
        if (!userAnswer.trim()) return;
        const user = userAnswer.trim().toLowerCase();
        const word = currentQuestion.word.toLowerCase();
        const target = (currentQuestion.target || currentQuestion.word).toLowerCase();
        // 原形でも文中の活用形でも正解と判定
        handleAnswerSubmit(user === word || user === target);
      };

      // 次の問題へ
      const handleNextQuestion = () => {
        if (currentIndex + 1 < quizQueue.length) {
          setCurrentIndex((prev) => prev + 1);
          setUserAnswer('');
          setShowMentalAnswer(false);
          setCurrentResult(null);
          setScreen('quiz');
        } else {
          setScreen('result');
        }
      };

      // データ初期化
      const resetAllProgress = () => {
        if (window.confirm('学習データをすべて初期化しますか？')) {
          localStorage.removeItem(STORAGE_KEY);
          setLearningRecords({});
        }
      };

      return (
        <div className="min-h-[100dvh] flex flex-col items-center justify-start sm:justify-center p-3 sm:p-5">
          <div className="w-full max-w-lg bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden flex flex-col my-auto">

            {/* ========================================================= */}
            {/* 1. TOP画面（出題設定） */}
            {/* ========================================================= */}
            {screen === 'home' && (
              <div className="p-5 sm:p-7 space-y-5">
                <div className="text-center pt-1">
                  <div className="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-2 text-2xl shadow-lg shadow-indigo-100">
                    🧠
                  </div>
                  <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                    SRS 忘却曲線 英単語
                  </h1>
                  <p className="text-xs text-slate-500 font-semibold mt-0.5">
                    完全200単語マスター（音声全文発音対応）
                  </p>
                </div>

                {/* 学習ステータス */}
                <div className="grid grid-cols-2 gap-3">
                  <div className="bg-amber-50 border border-amber-200/70 p-3.5 rounded-2xl text-center">
                    <div className="text-xs font-bold text-amber-700 mb-0.5">本日の復習対象</div>
                    <div className="text-3xl font-black text-amber-900">
                      {reviewCount} <span className="text-xs font-normal text-amber-600">語</span>
                    </div>
                  </div>
                  <div className="bg-emerald-50 border border-emerald-200/70 p-3.5 rounded-2xl text-center">
                    <div className="text-xs font-bold text-emerald-700 mb-0.5">未学習の単語</div>
                    <div className="text-3xl font-black text-emerald-900">
                      {newCount} <span className="text-xs font-normal text-emerald-600">/ 200</span>
                    </div>
                  </div>
                </div>

                {/* 出題数選択 */}
                <div>
                  <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">
                    出題数を選択
                  </label>
                  <div className="grid grid-cols-4 gap-2">
                    {[5, 10, 15, 20].map((num) => (
                      <button
                        key={num}
                        onClick={() => setQuestionCount(num)}
                        className={`py-2.5 rounded-xl text-xs font-black transition-all active:scale-95 ${
                          questionCount === num
                            ? 'bg-indigo-600 text-white shadow-md shadow-indigo-200'
                            : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                        }`}
                      >
                        {num}問
                      </button>
                    ))}
                  </div>
                </div>

                {/* 解答モード選択 */}
                <div>
                  <label className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-1.5">
                    解答方法を選択
                  </label>
                  <div className="space-y-1.5">
                    {[
                      { id: 'choice', title: '4択で答える', desc: '4つの選択肢から選ぶ' },
                      { id: 'input', title: '入力して答える', desc: 'キーボードでスペル入力' },
                      { id: 'mental', title: '心の中で答える', desc: '正解を見て自己採点' },
                    ].map((mode) => (
                      <button
                        key={mode.id}
                        onClick={() => setAnswerMode(mode.id)}
                        className={`w-full p-3 rounded-xl border-2 text-left flex items-center justify-between transition-all active:scale-[0.99] ${
                          answerMode === mode.id
                            ? 'border-indigo-600 bg-indigo-50/50 text-indigo-950 shadow-sm'
                            : 'border-slate-200 text-slate-600 hover:border-slate-300'
                        }`}
                      >
                        <div>
                          <div className="text-xs sm:text-sm font-bold text-slate-800">{mode.title}</div>
                          <div className="text-[10px] text-slate-400">{mode.desc}</div>
                        </div>
                        <div className={`w-4 h-4 rounded-full border-2 flex items-center justify-center ${
                          answerMode === mode.id ? 'border-indigo-600 bg-indigo-600' : 'border-slate-300'
                        }`}>
                          {answerMode === mode.id && <div className="w-1.5 h-1.5 rounded-full bg-white" />}
                        </div>
                      </button>
                    ))}
                  </div>
                </div>

                {/* 回答後の自動全文発音トグル */}
                <div className="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl">
                  <div className="flex items-center gap-2">
                    <span className="text-base">🔊</span>
                    <div>
                      <div className="text-xs font-bold text-slate-700">回答後に全文を自動発音</div>
                      <div className="text-[10px] text-slate-400">答え合わせ時に英語を自動で読み上げます</div>
                    </div>
                  </div>
                  <button
                    onClick={() => setAutoSpeakAnswer(!autoSpeakAnswer)}
                    className={`w-11 h-6 flex items-center rounded-full p-1 transition-colors duration-300 ${
                      autoSpeakAnswer ? 'bg-indigo-600' : 'bg-slate-300'
                    }`}
                  >
                    <div className={`bg-white w-4 h-4 rounded-full shadow-md transform transition-transform duration-300 ${
                      autoSpeakAnswer ? 'translate-x-5' : 'translate-x-0'
                    }`} />
                  </button>
                </div>

                {/* スタートボタン */}
                <button
                  onClick={startQuiz}
                  className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white font-black rounded-2xl shadow-lg shadow-indigo-200 text-sm transition-all"
                >
                  学習をスタートする
                </button>

                <div className="text-center pt-1">
                  <button
                    onClick={resetAllProgress}
                    className="text-[11px] text-slate-400 hover:text-rose-500 transition-colors"
                  >
                    学習データを初期化する
                  </button>
                </div>
              </div>
            )}

            {/* ========================================================= */}
            {/* 2. QUIZ画面 */}
            {/* ========================================================= */}
            {screen === 'quiz' && currentQuestion && (
              <div className="flex flex-col">
                {/* プログレスバー */}
                <div className="w-full h-1.5 bg-slate-100">
                  <div
                    className="h-full bg-indigo-600 transition-all duration-300"
                    style={{ width: `${((currentIndex + 1) / quizQueue.length) * 100}%` }}
                  />
                </div>

                <div className="p-5 sm:p-7 space-y-4">
                  {/* ヘッダー */}
                  <div className="flex justify-between items-center text-xs font-bold text-slate-400">
                    <span className="bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full text-xs">
                      問 {currentIndex + 1} / {quizQueue.length}
                    </span>
                    <span>連続正解: {learningRecords[currentQuestion.id]?.streak || 0}回</span>
                  </div>

                  {/* 出題文カード */}
                  <div className="bg-slate-50 border border-slate-200/90 rounded-2xl p-4 sm:p-5 text-center">
                    <div className="flex items-start justify-between gap-2 text-left mb-2">
                      <div className="text-base sm:text-lg font-bold text-slate-800 leading-relaxed font-sans">
                        {blankedPhrase}
                      </div>
                      <button
                        onClick={() => speakText(currentQuestion.phrase)}
                        className="p-2.5 bg-white border border-slate-200 active:bg-indigo-50 text-indigo-600 rounded-xl shrink-0 shadow-sm text-sm"
                        title="全文を聴く"
                      >
                        🔊
                      </button>
                    </div>
                    <div className="pt-2 border-t border-slate-200/60 text-xs text-slate-500 font-medium text-left">
                      {currentQuestion.phraseJa}
                    </div>
                  </div>

                  {/* 解答エリア：1. 4択モード */}
                  {answerMode === 'choice' && (
                    <div className="space-y-2">
                      {choices.map((word, idx) => (
                        <button
                          key={idx}
                          onClick={() => handleAnswerSubmit(word.toLowerCase() === currentQuestion.word.toLowerCase())}
                          className="w-full p-3.5 border-2 border-slate-200 active:border-indigo-600 active:bg-indigo-50 text-left font-bold text-sm text-slate-700 rounded-xl transition-all flex items-center justify-between"
                        >
                          <span className="flex items-center gap-2.5">
                            <span className="w-5 h-5 rounded-md bg-slate-100 text-slate-500 flex items-center justify-center text-[10px]">
                              {idx + 1}
                            </span>
                            {word}
                          </span>
                          <span className="text-slate-300">→</span>
                        </button>
                      ))}
                    </div>
                  )}

                  {/* 解答エリア：2. 入力モード */}
                  {answerMode === 'input' && (
                    <form onSubmit={handleInputSubmit} className="space-y-3">
                      <input
                        type="text"
                        autoFocus
                        autoCapitalize="none"
                        autoCorrect="off"
                        spellCheck="false"
                        value={userAnswer}
                        onChange={(e) => setUserAnswer(e.target.value)}
                        placeholder="英単語を入力..."
                        className="w-full p-3.5 border-2 border-slate-200 focus:border-indigo-600 rounded-xl text-center text-base sm:text-lg font-bold outline-none"
                      />
                      <button
                        type="submit"
                        disabled={!userAnswer.trim()}
                        className="w-full py-3.5 bg-indigo-600 active:bg-indigo-700 disabled:bg-slate-300 text-white font-bold rounded-xl text-sm transition-all"
                      >
                        解答する（発音付き）
                      </button>
                    </form>
                  )}

                  {/* 解答エリア：3. 心の中で答えるモード */}
                  {answerMode === 'mental' && (
                    <div className="space-y-3">
                      {!showMentalAnswer ? (
                        <button
                          onClick={() => setShowMentalAnswer(true)}
                          className="w-full py-4 bg-indigo-600 active:bg-indigo-700 text-white font-bold rounded-xl text-sm shadow-md"
                        >
                          正解を見る
                        </button>
                      ) : (
                        <div>
                          <div className="p-3 bg-indigo-50 border border-indigo-200 rounded-xl text-center mb-3">
                            <span className="text-[10px] font-bold text-indigo-500 block">正解</span>
                            <span className="text-xl font-black text-indigo-900">{currentQuestion.word}</span>
                          </div>
                          <div className="grid grid-cols-2 gap-2">
                            <button
                              onClick={() => handleAnswerSubmit(false)}
                              className="py-3 bg-rose-50 border border-rose-200 active:bg-rose-100 text-rose-700 font-bold rounded-xl text-xs"
                            >
                              × 分からなかった
                            </button>
                            <button
                              onClick={() => handleAnswerSubmit(true)}
                              className="py-3 bg-emerald-600 active:bg-emerald-700 text-white font-bold rounded-xl text-xs shadow-md"
                            >
                              ○ 分かっていた
                            </button>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ========================================================= */}
            {/* 3. 結果・解説画面（★回答後の全文発音ボタン＆自動再生★） */}
            {/* ========================================================= */}
            {screen === 'explanation' && currentResult && (
              <div className="p-5 sm:p-7 space-y-4">
                {/* 正誤ヘッダー */}
                <div className={`p-3.5 rounded-2xl flex items-center gap-3 ${
                  currentResult.isCorrect ? 'bg-emerald-50 text-emerald-800 border border-emerald-200' : 'bg-rose-50 text-rose-800 border border-rose-200'
                }`}>
                  <span className="text-2xl">{currentResult.isCorrect ? '⭕' : '❌'}</span>
                  <div>
                    <div className="text-sm font-black">
                      {currentResult.isCorrect ? '正解！ Correct!' : '不正解… Incorrect'}
                    </div>
                    <div className="text-[11px] opacity-80">
                      {currentResult.isCorrect
                        ? '忘却曲線により次回の復習日を延ばしました。'
                        : '連続正解がリセットされ、明日また復習します。'}
                    </div>
                  </div>
                </div>

                {/* 音声コントロールバー */}
                <div className="bg-indigo-50/70 border border-indigo-100 rounded-2xl p-3 flex items-center justify-between">
                  <span className="text-xs font-bold text-indigo-900">🔊 音声を再生する:</span>
                  <div className="flex gap-1.5">
                    <button
                      onClick={() => speakText(currentResult.question.phrase)}
                      className="px-3 py-1.5 bg-indigo-600 active:bg-indigo-700 text-white font-bold rounded-lg text-xs shadow-sm flex items-center gap-1"
                    >
                      ▶ フレーズ全文
                    </button>
                    <button
                      onClick={() => speakText(currentResult.question.word)}
                      className="px-2.5 py-1.5 bg-white border border-indigo-200 active:bg-indigo-100 text-indigo-700 font-bold rounded-lg text-xs"
                    >
                      単語
                    </button>
                    <button
                      onClick={() => speakText(currentResult.question.otherPhrase)}
                      className="px-2.5 py-1.5 bg-white border border-indigo-200 active:bg-indigo-100 text-indigo-700 font-bold rounded-lg text-xs"
                    >
                      例文
                    </button>
                  </div>
                </div>

                {/* 詳細カード */}
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3 text-left">
                  {/* 正解の単語 */}
                  <div>
                    <div className="text-[10px] font-bold text-indigo-600 uppercase tracking-wider">
                      正解の英単語
                    </div>
                    <div className="text-2xl font-black text-slate-900 mt-0.5">
                      {currentResult.question.word}
                    </div>
                    <div className="text-xs font-semibold text-slate-600 mt-0.5">
                      {currentResult.question.meaning}
                    </div>
                  </div>

                  {/* 実践フレーズ（完全文） */}
                  <div className="pt-2.5 border-t border-slate-200">
                    <div className="flex justify-between items-center mb-0.5">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                        実践フレーズ（完全文）
                      </span>
                      <button
                        onClick={() => speakText(currentResult.question.phrase)}
                        className="text-indigo-600 text-xs font-bold hover:underline"
                      >
                        🔊 発音
                      </button>
                    </div>
                    <div className="text-xs sm:text-sm font-bold text-slate-800">
                      {currentResult.question.phrase}
                    </div>
                    <div className="text-[11px] text-slate-500 mt-0.5">
                      {currentResult.question.phraseJa}
                    </div>
                  </div>

                  {/* 別の文脈・使い方例文 */}
                  <div className="pt-2.5 border-t border-slate-200">
                    <div className="flex justify-between items-center mb-0.5">
                      <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider">
                        別の文脈・使い方例文
                      </span>
                      <button
                        onClick={() => speakText(currentResult.question.otherPhrase)}
                        className="text-indigo-600 text-xs font-bold hover:underline"
                      >
                        🔊 発音
                      </button>
                    </div>
                    <div className="text-xs sm:text-sm font-bold text-slate-800">
                      {currentResult.question.otherPhrase}
                    </div>
                    <div className="text-[11px] text-slate-500 mt-0.5">
                      {currentResult.question.otherPhraseJa}
                    </div>
                  </div>
                </div>

                {/* 次の問題へボタン */}
                <button
                  onClick={handleNextQuestion}
                  className="w-full py-4 bg-indigo-600 active:bg-indigo-700 text-white font-black rounded-2xl text-sm shadow-lg shadow-indigo-100 transition-all"
                >
                  {currentIndex + 1 < quizQueue.length ? '次の問題へ進む' : '結果を見る'}
                </button>
              </div>
            )}

            {/* ========================================================= */}
            {/* 4. RESULT画面 */}
            {/* ========================================================= */}
            {screen === 'result' && (
              <div className="p-6 sm:p-8 text-center space-y-5">
                <div className="w-14 h-14 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center mx-auto text-3xl shadow-inner">
                  🎉
                </div>
                <div>
                  <h2 className="text-xl sm:text-2xl font-black text-slate-900">セッション完了！</h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    忘却曲線に基づいて次回の学習日が自動更新されました
                  </p>
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-5">
                  <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">正答率</div>
                  <div className="text-4xl sm:text-5xl font-black text-indigo-600">
                    {Math.round((sessionCorrectCount / quizQueue.length) * 100)}%
                  </div>
                  <div className="text-xs text-slate-500 font-bold mt-1">
                    {quizQueue.length} 問中 {sessionCorrectCount} 問 正解
                  </div>
                </div>

                <button
                  onClick={() => setScreen('home')}
                  className="w-full py-3.5 bg-indigo-600 active:bg-indigo-700 text-white font-black rounded-2xl text-sm shadow-lg shadow-indigo-100 transition-all"
                >
                  トップ画面に戻る
                </button>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
