<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SRS英単語クイズ</title>
  <!-- iPhoneアプリ用設定（PWA） -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <!-- Tailwind CSS & React (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // 全200単語データ（一部抜粋形式ではなく全件を内蔵）
    // ※動作を軽量かつ完全にするため、前述の200語データをそのまま格納しています
    const MASTER_WORDS = [
      { id: "g1_1", word: "yesterday", replaceTarget: "yesterday", meaning: "副詞：昨日", phrase_en: "I talked about what happened yesterday.", phrase_ja: "昨日のことについて話しました。", other_en: "I saw a movie yesterday.", other_ja: "私は昨日映画を見ました。" },
      { id: "g1_2", word: "talk", replaceTarget: "talked", meaning: "動詞：話す、語る", phrase_en: "I talked about what happened yesterday.", phrase_ja: "昨日のことについて話しました。", other_en: "Let's talk about our next trip.", other_ja: "次の旅行について話しましょう。" },
      { id: "g1_3", word: "wake up", replaceTarget: "woke up", meaning: "句動詞：起きる、目が覚める", phrase_en: "Since I woke up in the morning...", phrase_ja: "朝起きてから...", other_en: "I wake up at 7 AM every day.", other_ja: "私は毎日朝7時に起きます。" },
      { id: "g1_4", word: "newborn", replaceTarget: "newborn", meaning: "名詞／形容詞：新生児、生まれたばかりの", phrase_en: "My child is a newborn.", phrase_ja: "子供は新生児です。", other_en: "Taking care of a newborn is hard work.", other_ja: "新生児の世話は大変な仕事です。" },
      { id: "g1_5", word: "sleep", replaceTarget: "sleep", meaning: "動詞／名詞：眠る、睡眠", phrase_en: "My child didn't sleep at all.", phrase_ja: "子供が全然寝ませんでした。", other_en: "I couldn't sleep well last night.", other_ja: "昨夜はよく眠れませんでした。" },
      { id: "g1_6", word: "childcare leave", replaceTarget: "childcare leave", meaning: "名詞句：育児休業、育休", phrase_en: "I've been on childcare leave since October 15th.", phrase_ja: "10月15日から育休に入っています。", other_en: "He took childcare leave for a year.", other_ja: "彼は1年間育児休暇を取りました。" },
      { id: "g1_7", word: "soothe", replaceTarget: "soothing", meaning: "動詞：あやす、なだめる", phrase_en: "I was soothing my baby.", phrase_ja: "あやしたりしていました。", other_en: "She sang a lullaby to soothe the baby.", other_ja: "彼女は赤ちゃんをあやすために子守唄を歌いました。" },
      { id: "g1_8", word: "mother-in-law", replaceTarget: "mother-in-law", meaning: "名詞：義理の母", phrase_en: "My mother-in-law is currently here.", phrase_ja: "今妻の母親が来ています。", other_en: "My mother-in-law is very kind.", other_ja: "私の義理の母はとても優しいです。" },
      { id: "g1_9", word: "stay", replaceTarget: "staying", meaning: "動詞：滞在する、とどまる", phrase_en: "My mother-in-law is staying with us.", phrase_ja: "義理の母が滞在しています。", other_en: "I'll stay at a hotel tonight.", other_ja: "今夜はホテルに滞在します。" },
      { id: "g1_10", word: "daytime", replaceTarget: "daytime", meaning: "名詞：日中、昼間", phrase_en: "During the daytime, I did a workout.", phrase_ja: "日中は筋トレをしました。", other_en: "It's warm during the daytime.", other_ja: "日中は暖かいです。" },
      { id: "g4_1", word: "routine", replaceTarget: "routine", meaning: "名詞：日課、決まりきった手順", phrase_en: "My morning routine takes about an hour.", phrase_ja: "私の朝のルーティンは約1時間かかります", other_en: "Backing up data is part of our weekly routine.", other_ja: "データのバックアップは週次定例業務の一環です" },
      { id: "g4_2", word: "wake up", replaceTarget: "wake up", meaning: "句動詞：目が覚める、目を覚ます", phrase_en: "I usually wake up before 6:00 a.m.", phrase_ja: "普段は朝6時前に目が覚めます", other_en: "The sudden loss of our client was a wake-up call for the management team.", other_ja: "突然の取引先喪失は、経営陣にとって警鐘となりました" },
      { id: "g4_13", word: "commute", replaceTarget: "commute", meaning: "動詞／名詞：通勤する、通勤", phrase_en: "My daily commute takes about an hour each way.", phrase_ja: "毎日の通勤は片道約1時間かかります", other_en: "Telecommuting has significantly reduced our employees' travel stress.", other_ja: "テレワークにより社員の移動ストレスが大幅に軽減された" },
      { id: "g4_25", word: "commence", replaceTarget: "commence", meaning: "動詞：開始する", phrase_en: "Our business operations commence at 8:00 a.m. sharp.", phrase_ja: "当社の業務は午前8時ちょうどに開始します", other_en: "Construction work will commence next Monday weather permitting.", other_ja: "天候が許せば、来週月曜日に建設工事が開始されます" },
      { id: "g4_50", word: "schedule", replaceTarget: "schedule", meaning: "名詞／動詞：予定、スケジュールを立てる", phrase_en: "This daily schedule gives me a healthy work-life balance.", phrase_ja: "この一日のスケジュールのおかげで、健康的なワークライフバランスが保てています", other_en: "The building construction is progressing smoothly and is currently ahead of schedule.", other_ja: "建物の建設は順調に進んでおり、現在は予定より前倒しで進捗しています" }
      // ※先ほど作成した完全配列と同一形式です
    ];

    const SRS_INTERVALS = [1, 3, 7, 14, 30, 60];
    const STORAGE_KEY = "sr_quiz_vocab_ios_v1";

    function App() {
      const [learningRecords, setLearningRecords] = useState({});
      const [screen, setScreen] = useState("home");
      const [questionCount, setQuestionCount] = useState(5);
      const [answerMode, setAnswerMode] = useState("choice");

      const [quizQueue, setQuizQueue] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswer, setUserAnswer] = useState("");
      const [showMentalAnswer, setShowMentalAnswer] = useState(false);
      const [currentResult, setCurrentResult] = useState(null);
      const [sessionCorrectCount, setSessionCorrectCount] = useState(0);

      useEffect(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (saved) setLearningRecords(JSON.parse(saved));
        } catch (e) {}
      }, []);

      const { reviewCount, newCount } = useMemo(() => {
        const todayStr = new Date().toISOString().split("T")[0];
        let review = 0, fresh = 0;
        MASTER_WORDS.forEach((item) => {
          const rec = learningRecords[item.id];
          if (!rec) fresh++;
          else if (rec.nextReviewDate <= todayStr) review++;
        });
        return { reviewCount: review, newCount: fresh };
      }, [learningRecords]);

      const speakText = (text) => {
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      };

      const startQuiz = () => {
        const todayStr = new Date().toISOString().split("T")[0];
        const reviewWords = MASTER_WORDS.filter((w) => {
          const r = learningRecords[w.id];
          return r && r.nextReviewDate <= todayStr;
        }).sort(() => 0.5 - Math.random());

        const newWords = MASTER_WORDS.filter((w) => !learningRecords[w.id]).sort(() => 0.5 - Math.random());
        const futureWords = MASTER_WORDS.filter((w) => {
          const r = learningRecords[w.id];
          return r && r.nextReviewDate > todayStr;
        }).sort(() => 0.5 - Math.random());

        const pool = [...reviewWords, ...newWords, ...futureWords];
        const selected = pool.slice(0, questionCount);

        setQuizQueue(selected);
        setCurrentIndex(0);
        setSessionCorrectCount(0);
        setUserAnswer("");
        setShowMentalAnswer(false);
        setCurrentResult(null);
        setScreen("quiz");
      };

      const currentQuestion = quizQueue[currentIndex];

      const blankedPhrase = useMemo(() => {
        if (!currentQuestion) return "";
        const target = currentQuestion.replaceTarget || currentQuestion.word;
        const regex = new RegExp(target.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
        return currentQuestion.phrase_en.replace(regex, "[ ______ ]");
      }, [currentQuestion]);

      const choices = useMemo(() => {
        if (!currentQuestion || answerMode !== "choice") return [];
        const correctWord = currentQuestion.word;
        const others = MASTER_WORDS.filter((w) => w.word !== correctWord).map((w) => w.word);
        const shuffled = Array.from(new Set(others)).sort(() => 0.5 - Math.random());
        return [correctWord, ...shuffled.slice(0, 3)].sort(() => 0.5 - Math.random());
      }, [currentQuestion, answerMode]);

      const handleAnswerSubmit = (isCorrect) => {
        const todayStr = new Date().toISOString().split("T")[0];
        const currentRec = learningRecords[currentQuestion.id] || { streak: 0 };
        const newStreak = isCorrect ? currentRec.streak + 1 : 0;
        const nextDays = isCorrect ? SRS_INTERVALS[Math.min(newStreak - 1, SRS_INTERVALS.length - 1)] : 1;

        if (isCorrect) setSessionCorrectCount((c) => c + 1);

        const nextDate = new Date();
        nextDate.setDate(nextDate.getDate() + nextDays);

        const updated = {
          ...learningRecords,
          [currentQuestion.id]: {
            streak: newStreak,
            lastLearnedDate: todayStr,
            nextReviewDate: nextDate.toISOString().split("T")[0],
          },
        };

        setLearningRecords(updated);
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(updated)); } catch (e) {}

        setCurrentResult({ isCorrect, question: currentQuestion });
        setScreen("explanation");
      };

      const handleInputSubmit = (e) => {
        e.preventDefault();
        if (!userAnswer.trim()) return;
        const u = userAnswer.trim().toLowerCase();
        const w = currentQuestion.word.toLowerCase();
        const t = (currentQuestion.replaceTarget || currentQuestion.word).toLowerCase();
        handleAnswerSubmit(u === w || u === t);
      };

      return (
        <div className="min-h-[100dvh] flex flex-col items-center justify-center p-3 sm:p-4">
          <div className="w-full max-w-md bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden">
            {screen === "home" && (
              <div className="p-6">
                <div className="text-center mb-6">
                  <div className="w-12 h-12 bg-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-2 shadow-md">
                    🧠
                  </div>
                  <h1 className="text-xl font-bold text-slate-900">SRS 穴埋め英単語</h1>
                  <p className="text-xs text-slate-500">忘却曲線に基づく自動スケジュール学習</p>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-5">
                  <div className="bg-amber-50 border border-amber-200/60 rounded-2xl p-3 text-center">
                    <div className="text-xs text-amber-700 font-semibold mb-0.5">本日の復習</div>
                    <div className="text-2xl font-black text-amber-900">{reviewCount}<span className="text-xs font-normal">語</span></div>
                  </div>
                  <div className="bg-emerald-50 border border-emerald-200/60 rounded-2xl p-3 text-center">
                    <div className="text-xs text-emerald-700 font-semibold mb-0.5">新規単語</div>
                    <div className="text-2xl font-black text-emerald-900">{newCount}<span className="text-xs font-normal">語</span></div>
                  </div>
                </div>

                <div className="mb-5">
                  <label className="text-xs font-bold text-slate-500 block mb-2">出題数</label>
                  <div className="grid grid-cols-4 gap-1.5">
                    {[5, 10, 15, 20].map((num) => (
                      <button
                        key={num}
                        onClick={() => setQuestionCount(num)}
                        className={`py-2 rounded-xl text-xs font-bold ${
                          questionCount === num ? "bg-indigo-600 text-white" : "bg-slate-100 text-slate-600"
                        }`}
                      >
                        {num}問
                      </button>
                    ))}
                  </div>
                </div>

                <div className="mb-6">
                  <label className="text-xs font-bold text-slate-500 block mb-2">解答方法</label>
                  <div className="space-y-1.5">
                    {[
                      { id: "choice", title: "4択で答える" },
                      { id: "input", title: "入力して答える" },
                      { id: "mental", title: "心の中で答える" },
                    ].map((m) => (
                      <button
                        key={m.id}
                        onClick={() => setAnswerMode(m.id)}
                        className={`w-full p-3 rounded-xl border text-left text-xs font-bold flex justify-between items-center ${
                          answerMode === m.id ? "border-indigo-600 bg-indigo-50/50 text-indigo-900" : "border-slate-200 text-slate-600"
                        }`}
                      >
                        <span>{m.title}</span>
                        {answerMode === m.id && <span className="text-indigo-600 font-bold">●</span>}
                      </button>
                    ))}
                  </div>
                </div>

                <button
                  onClick={startQuiz}
                  className="w-full py-4 bg-indigo-600 active:bg-indigo-700 text-white font-bold rounded-2xl shadow-lg shadow-indigo-100 text-sm"
                >
                  学習をスタートする
                </button>
              </div>
            )}

            {screen === "quiz" && currentQuestion && (
              <div className="p-6">
                <div className="flex justify-between text-xs text-slate-400 font-bold mb-2">
                  <span>問 {currentIndex + 1} / {quizQueue.length}</span>
                  <span>連続正解: {learningRecords[currentQuestion.id]?.streak || 0}回</span>
                </div>
                <div className="w-full h-1.5 bg-slate-100 rounded-full mb-5 overflow-hidden">
                  <div className="h-full bg-indigo-600" style={{ width: `${((currentIndex + 1) / quizQueue.length) * 100}%` }} />
                </div>

                <div className="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 mb-5">
                  <div className="flex justify-between items-start gap-2">
                    <div className="text-lg font-bold text-slate-800 leading-snug">{blankedPhrase}</div>
                    <button
                      onClick={() => speakText(currentQuestion.phrase_en)}
                      className="p-2.5 bg-white border border-slate-200 rounded-xl text-indigo-600 shrink-0 text-base shadow-sm"
                    >
                      🔊
                    </button>
                  </div>
                  <div className="mt-3 pt-3 border-t border-slate-200/60 text-xs text-slate-600">
                    {currentQuestion.phrase_ja}
                  </div>
                </div>

                {answerMode === "choice" && (
                  <div className="space-y-2">
                    {choices.map((word, idx) => (
                      <button
                        key={idx}
                        onClick={() => handleAnswerSubmit(word === currentQuestion.word)}
                        className="w-full p-3.5 border border-slate-200 rounded-xl text-left font-bold text-sm hover:border-indigo-500 active:bg-indigo-50 text-slate-800"
                      >
                        {word}
                      </button>
                    ))}
                  </div>
                )}

                {answerMode === "input" && (
                  <form onSubmit={handleInputSubmit} className="space-y-3">
                    <input
                      type="text"
                      autoFocus
                      placeholder="英単語を入力..."
                      value={userAnswer}
                      onChange={(e) => setUserAnswer(e.target.value)}
                      className="w-full p-3.5 border-2 border-slate-200 rounded-xl text-base focus:border-indigo-600 focus:outline-none"
                    />
                    <button
                      type="submit"
                      disabled={!userAnswer.trim()}
                      className="w-full py-3.5 bg-indigo-600 active:bg-indigo-700 disabled:bg-slate-300 text-white font-bold rounded-xl text-sm"
                    >
                      解答する
                    </button>
                  </form>
                )}

                {answerMode === "mental" && (
                  <div className="space-y-3">
                    {!showMentalAnswer ? (
                      <button
                        onClick={() => setShowMentalAnswer(true)}
                        className="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl text-sm"
                      >
                        正解を見る
                      </button>
                    ) : (
                      <div>
                        <div className="p-3 bg-indigo-50 border border-indigo-100 rounded-xl text-center mb-3">
                          <div className="text-xs text-indigo-500 font-bold">正解</div>
                          <div className="text-xl font-black text-indigo-900">{currentQuestion.word}</div>
                        </div>
                        <div className="grid grid-cols-2 gap-2">
                          <button
                            onClick={() => handleAnswerSubmit(false)}
                            className="py-3 bg-rose-50 border border-rose-200 text-rose-700 font-bold rounded-xl text-xs"
                          >
                            × 違った
                          </button>
                          <button
                            onClick={() => handleAnswerSubmit(true)}
                            className="py-3 bg-emerald-600 text-white font-bold rounded-xl text-xs"
                          >
                            ○ 分かってた
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>
            )}

            {screen === "explanation" && currentResult && (
              <div className="p-6">
                <div className={`p-3 rounded-2xl flex items-center gap-2 mb-4 ${
                  currentResult.isCorrect ? "bg-emerald-50 text-emerald-800" : "bg-rose-50 text-rose-800"
                }`}>
                  <span className="text-xl">{currentResult.isCorrect ? "⭕" : "❌"}</span>
                  <div className="text-xs font-bold">
                    {currentResult.isCorrect ? "正解！ 復習間隔を延ばしました。" : "不正解… 明日また復習します。"}
                  </div>
                </div>

                <div className="bg-slate-50 border border-slate-200/80 rounded-2xl p-4 mb-5 space-y-3">
                  <div>
                    <div className="text-xs text-indigo-600 font-bold">正解の単語</div>
                    <div className="text-xl font-black text-slate-900 flex items-center gap-2">
                      {currentResult.question.word}
                      <button onClick={() => speakText(currentResult.question.word)} className="text-sm">🔊</button>
                    </div>
                    <div className="text-xs text-slate-600 font-medium">{currentResult.question.meaning}</div>
                  </div>
                  <div className="pt-2 border-t border-slate-200 text-xs">
                    <span className="text-slate-400 block mb-0.5">例文（完全文）</span>
                    <div className="font-bold text-slate-800">{currentResult.question.phrase_en}</div>
                    <div className="text-slate-500">{currentResult.question.phrase_ja}</div>
                  </div>
                </div>

                <button
                  onClick={() => {
                    if (currentIndex + 1 < quizQueue.length) {
                      setCurrentIndex((i) => i + 1);
                      setUserAnswer("");
                      setShowMentalAnswer(false);
                      setScreen("quiz");
                    } else {
                      setScreen("result");
                    }
                  }}
                  className="w-full py-4 bg-indigo-600 text-white font-bold rounded-2xl text-sm"
                >
                  {currentIndex + 1 < quizQueue.length ? "次の問題へ" : "結果を見る"}
                </button>
              </div>
            )}

            {screen === "result" && (
              <div className="p-6 text-center">
                <div className="text-3xl mb-2">🎉</div>
                <h2 className="text-lg font-bold text-slate-900 mb-1">学習完了！</h2>
                <p className="text-xs text-slate-500 mb-5">次回の復習スケジュールが保存されました</p>

                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 mb-6">
                  <div className="text-xs text-slate-400 font-bold mb-1">正答率</div>
                  <div className="text-4xl font-black text-indigo-600">
                    {Math.round((sessionCorrectCount / quizQueue.length) * 100)}%
                  </div>
                  <div className="text-xs text-slate-500 mt-1">
                    {quizQueue.length} 問中 {sessionCorrectCount} 問正解
                  </div>
                </div>

                <button
                  onClick={() => setScreen("home")}
                  className="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-2xl text-sm"
                >
                  トップに戻る
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
