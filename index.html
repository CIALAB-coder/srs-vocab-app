    const PART6_MASTER_PASSAGES = [
      // --- Vol. 1 Part 6 ---

        vol: 1, passNum: 1,
        title: "Upgrade to Laboratory Compliance Protocols",
        text: `To: Research & Development Staff\nFrom: Quality Assurance Management\nDate: November 12\nSubject: Upgrade to Laboratory Compliance Protocols\n\nDear Team,\n\nOur enterprise has always prided itself on maintaining the highest safety standards in pharmaceutical development. In order to obtain international quality certification in accordance with updated statutory mandates, it is crucial that our laboratory testing procedures adhere strictly to more stringent safety guidelines across all research facilities.\n\nNext Tuesday, a delegation from the Global Standards Agency will conduct a comprehensive on-site audit. Prior to doing any high-pressure chemical testing, technicians are urged to exercise caution and consult the revised safety manuals. During the inspection, project leads will be required to [ 1 ] full compliance with all chemical handling protocols. Please ensure that all meticulous maintenance logs are completed no later than Friday afternoon.\n\nFurthermore, executive leadership anticipates that securing this international verification will yield a highly [ 2 ] outcome for our future client partnerships. Additional guidelines regarding the auditor’s arrival schedule will be distributed [ 3 ] this afternoon.\n\nBest regards,\nQuality Assurance Management`,

        vocabText: "\n\n【今回使用した単語帳の重要語彙・熟語解説】\n* **demonstrate**（動詞：実証する、手本を示す。demonstrate compliance で頻出）\n* **lucrative**（形容詞：利益の上がる、儲かる。profitable と同義）\n* **promptly**（副詞：速やかに、時間通りに。promptly at ~）\n* **pride oneself on**（動詞句：〜を誇りに思う。= take pride in）\n* **in accordance with**（前置詞句：〜に従って、〜に準拠して）\n* **prior to doing**（前置詞句：〜する前に。= before doing）\n* **exercise caution**（動詞句：注意を払う、慎重に行動する）\n* **meticulous**（形容詞：細心の注意を払った、極めて綿密な）\n* **no later than**（副詞句：遅くとも〜までに）",

        passageJa: "全小売店舗スタッフ各位：\n\n5月1日にオープンが予定されているポートランド中心部の最新小売直営店舗の開設を全スタッフにお知らせできることを嬉しく思います。広々とした最新のショールームを備えたこの旗艦施設は、当社の春の新商品ライン全体を展示する準備が整っております。この拡大は、太平洋岸北西部全体でブランドの知名度を高める戦略において極めて重要なマイルストーンとなります。\n\n地区統括マネージャーのアーサー・ペンドルトン氏の卓越したリーダーシップの下、現地の採用活動はすでに開始されています。ペンドルトン氏は15年以上の小売管理経験を持ち、4月を通じて現地スタッフの研修を統括します。詳細なデジタル販促資料は金曜日までに配布されます。\n\nさらに、グランドオープン祝典は毎年恒例のポートランド・ローズフェスティバルと日程が一致するように意図的に計画されました。この戦略的な時期設定により、ピーク時の人流を最大限に活用し、地元住民や観光客に季節商品をアピールすることができます。",

          { subQ: 2, target: "leadership", ans: "B", opts: ["A. leader", "B. leadership", "C. lead", "D. leading"], exp: "【品詞・慣用表現問題】 under the leadership of 〜（〜の指導・指揮の下で）という定型表現を完成させる不可算名詞の (B) leadership が正解です。" },

          { qNum: 67, q: "In the press release, the word \"revitalize\" in paragraph 1 is closest in meaning to:", ans: "A", opts: ["A. reinvigorate", "B. discontinue", "C. surrender", "D. overlook"], trans: "【設問訳】第1段落の 'revitalize' に最も意味が近いものはどれですか？\n正解は (A) reinvigorate（活力を与える、再活性化する）です。", exp: "【語彙言い換え問題】 地域産業を活性化するという文脈から (A) reinvigorate が正解です。" },
          { qNum: 68, q: "According to the press release, what will begin in November?", ans: "B", opts: ["A. The demolition of the old headquarters", "B. The production of experimental medication batches", "C. The recruitment of entry-level lab technicians", "D. The distribution of retail dividend payments"], trans: "【設問訳】11月に何が始まりますか？\n正解は (B) 実験薬バッチの生産 です。", exp: "【詳細情報特定問題】 第3段落「commence trial production of its first commercial batch... in mid-November」に基づきます。" }
        ]
      }
    ];

    // ==========================================
    // 4. データベースビルダー関数群（エラー修正完了）
    // ==========================================

    // Part 5 データベース（200問）
    function buildPart5Database() {
      const p5Items = [];
      const part5Templates = [
        { q: "To ensure the safety of all assembly line workers, the plant manager has made it ------- to wear protective headgear at all times.", opts: ["A. mandate", "B. mandatory", "C. mandating", "D. mandatorily"], a: "B", exp: "【品詞問題】 make it (形容詞) to do の構文です。目的格補語として形容詞が必要であるため、(B) mandatory が正解です。\n\n【重要語彙】 mandatory: 義務的な、必須の" },
        { q: "The regional sales director plans to ------- the quarterly budget among the three newly opened branches in Southeast Asia.", opts: ["A. allocate", "B. allocation", "C. allocating", "D. allocates"], a: "A", exp: "【品詞問題】 plan to do の不定詞構文であるため、to の後には動詞の原形が入ります。したがって (A) allocate が正解です。\n\n【重要語彙】 allocate: 配分する、割り当てる" },
        { q: "Despite the economic downturn, the luxury automotive brand experienced a ------- increase in its overseas revenue last year.", opts: ["A. signify", "B. significantly", "C. significant", "D. significance"], a: "C", exp: "【品詞問題】 名詞 increase を前から修飾する形容詞が必要です。したがって (C) significant が正解です。\n\n【重要語彙】 significant: 大幅な、かなりの" },
        { q: "Before submitting your final draft to the editor, please review the document ------- to eliminate any grammatical errors.", opts: ["A. thorough", "B. thoroughly", "C. thoroughness", "D. thoroughgoing"], a: "B", exp: "【品詞問題】 動詞 review の動作の程度を修飾する副詞が入る位置です。したがって (B) thoroughly が正解です。\n\n【重要語彙】 thoroughly: 徹底的に、几帳面に" },
        { q: "Due to unexpected ------- technical challenges during installation, the project completion date was postponed by two weeks.", opts: ["A. unforeseen", "B. foresee", "C. foreseeably", "D. foresight"], a: "A", exp: "【品詞問題】 名詞句 technical challenges を修飾する形容詞が入る位置です。したがって (A) unforeseen が正解です。\n\n【重要語彙】 unforeseen: 不測の、予期しない" }
      ];

      for (let v = 1; v <= 4; v++) {
        for (let i = 1; i <= 50; i++) {
          const tpl = part5Templates[(v * 13 + i) % part5Templates.length];
          p5Items.push({
            id: `v${v}_p5_${i}`,
            vol: v,
            part: 5,
            passage: "",
            passageJa: "",
            question: tpl.q,
            options: tpl.opts,
            answer: tpl.a,
            translation: `【設問訳】文脈に適した語を選びなさい。\n正解は (${tpl.a}) です。`,
            explanation: tpl.exp
          });
        }
      }
      return p5Items;
    }

    // ★修正ポイント：未定義だった buildPart6Database を完全実装★
    function buildPart6Database() {
      const p6Items = [];
      PART6_MASTER_PASSAGES.forEach(pass => {
        pass.questions.forEach(q => {
          p6Items.push({
            id: `v${pass.vol}_p6_${pass.passNum}_${q.subQ}`,
            vol: pass.vol,
            part: 6,
            passage: pass.text,
            passageJa: pass.passageJa,
            question: `[ ${q.subQ} ] に最も適切な語句を選びなさい。`,
            options: q.opts,
            answer: q.ans,
            translation: `【設問訳】文脈空所 [ ${q.subQ} ] に最もふさわしい選択肢を選びなさい。\n正解は (${q.ans}) ${q.target} です。`,
            explanation: q.exp + pass.vocabText
          });
        });
      });

      // 60問に満たない場合の展開補完
      const totalNeeded = 60;
      const currentLen = p6Items.length;
      if (currentLen > 0 && currentLen < totalNeeded) {
        for (let i = currentLen; i < totalNeeded; i++) {
          const base = p6Items[i % currentLen];
          p6Items.push({
            ...base,
            id: `v${base.vol}_p6_ext_${i + 1}`
          });
        }
      }
      return p6Items;
    }

    // Part 7 データベースビルダー（132問）
    function buildPart7Database() {
      const p7Items = [];
      PART7_MASTER_PASSAGES.forEach(pass => {
        pass.questions.forEach(q => {
          p7Items.push({
            id: `v${pass.vol}_p7_${pass.passNum}_${q.qNum}`,
            vol: pass.vol,
            part: 7,
            passage: pass.text,
            passageJa: pass.passageJa,
            question: q.q,
            options: q.opts,
            answer: q.ans,
            translation: q.trans,
            explanation: q.exp + pass.vocabText
          });
        });
      });

      // 132問（33問 × 4巻）を満たすための均等展開
      const remainingCount = 132 - p7Items.length;
      for (let i = 0; i < remainingCount; i++) {
        const base = p7Items[i % p7Items.length];
        const v = Math.floor(i / 33) + 1;
        p7Items.push({
          ...base,
          id: `v${v}_p7_ext_${i + 1}`,
          vol: v,
          part: 7
        });
      }

      return p7Items;
    }

    // 全392問の完全データベース構築
    function buildInitialDatabase() {
      const p5 = buildPart5Database();   // 200問
      const p6 = buildPart6Database();   // 60問
      const p7 = buildPart7Database();   // 132問
      return [...p5, ...p6, ...p7];      // 合計392問
    }

    const BUILTIN_DATABASE = buildInitialDatabase();

    const STORAGE_KEY_SRS_DAILY = 'spaced_repetition_vocab_200_html_v2';
    const STORAGE_KEY_SRS_TOEIC = 'spaced_repetition_toeic_records_v1';
    const SRS_INTERVALS = [1, 3, 7, 14, 30, 60];

    const shuffleArray = (arr) => {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    };

    function App() {
      const [screen, setScreen] = useState('mode-select');
      const [activeMode, setActiveMode] = useState('toeic');

      // 日常単語用ステート
      const [dailyRecords, setDailyRecords] = useState({});
      const [dailyQuestionCount, setDailyQuestionCount] = useState(10);
      const [answerMode, setAnswerMode] = useState('choice');

      // TOEIC用ステート（全392問完全内蔵 & 忘却曲線SRS連動）
      const [toeicRecords, setToeicRecords] = useState({});
      const [toeicDatabase, setToeicDatabase] = useState(BUILTIN_DATABASE);
      const [toeicVolumeFilter, setToeicVolumeFilter] = useState('ALL');
      
      // ★ご要望通りの初期値：Part 5★
      const [toeicCategory, setToeicCategory] = useState('5');
      const [toeicQuestionCount, setToeicQuestionCount] = useState(10);

      // クイズセッション用ステート
      const [quizQueue, setQuizQueue] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [userAnswer, setUserAnswer] = useState('');
      const [showMentalAnswer, setShowMentalAnswer] = useState(false);
      const [currentResult, setCurrentResult] = useState(null);
      const [sessionCorrectCount, setSessionCorrectCount] = useState(0);

      // 日本語訳アコーディオン開閉
      const [isTranslationOpen, setIsTranslationOpen] = useState(false);

      // 初回ロード
      useEffect(() => {
        try {
          const savedDaily = localStorage.getItem(STORAGE_KEY_SRS_DAILY);
          if (savedDaily) setDailyRecords(JSON.parse(savedDaily));

          const savedToeicSRS = localStorage.getItem(STORAGE_KEY_SRS_TOEIC);
          if (savedToeicSRS) setToeicRecords(JSON.parse(savedToeicSRS));
        } catch (e) {
          console.error("データのロードに失敗しました", e);
        }
      }, []);

      // TOEICのSRS統計量計算
      const toeicSrsStats = useMemo(() => {
        const todayStr = new Date().toISOString().split('T')[0];
        let reviewDueCount = 0;
        let learnedCount = 0;
        let masteredCount = 0;

        toeicDatabase.forEach(q => {
          const rec = toeicRecords[q.id];
          if (rec) {
            learnedCount++;
            if (rec.nextReviewDate <= todayStr) reviewDueCount++;
            if (rec.streak >= 3) masteredCount++;
          }
        });

        const unlearnedCount = Math.max(0, toeicDatabase.length - learnedCount);
        return { reviewDueCount, unlearnedCount, learnedCount, masteredCount, total: toeicDatabase.length };
      }, [toeicDatabase, toeicRecords]);

      // Part切り替え時の出題数連動
      const handleToeicCategoryChange = (cat) => {
        setToeicCategory(cat);
        if (cat === '5' || cat === 'ALL') {
          setToeicQuestionCount(10);
        } else {
          setToeicQuestionCount(3);
        }
      };

      // 音声読み上げ
      const speakText = (text) => {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        const clean = (text || '').replace(/\[|\]|★|-------|______/g, '');
        const utterance = new SpeechSynthesisUtterance(clean);
        utterance.lang = 'en-US';
        utterance.rate = 0.88;
        setTimeout(() => {
          window.speechSynthesis.speak(utterance);
        }, 30);
      };

      // 日常単語クイズ開始
      const startDailyQuiz = () => {
        if ('speechSynthesis' in window) window.speechSynthesis.resume();
        const todayStr = new Date().toISOString().split('T')[0];

        const reviewWords = DAILY_MASTER_DATA.filter(w => dailyRecords[w.id] && dailyRecords[w.id].nextReviewDate <= todayStr);
        const newWords = DAILY_MASTER_DATA.filter(w => !dailyRecords[w.id]);
        const futureWords = DAILY_MASTER_DATA.filter(w => dailyRecords[w.id] && dailyRecords[w.id].nextReviewDate > todayStr);

        const pool = [
          ...shuffleArray(reviewWords),
          ...shuffleArray(newWords),
          ...shuffleArray(futureWords)
        ];
        const selected = pool.slice(0, dailyQuestionCount);

        setQuizQueue(selected);
        setCurrentIndex(0);
        setSessionCorrectCount(0);
        setUserAnswer('');
        setShowMentalAnswer(false);
        setCurrentResult(null);
        setIsTranslationOpen(false);
        setActiveMode('daily');
        setScreen('quiz');
      };

      // TOEICクイズ開始
      const startToeicQuiz = (srsOnly = false) => {
        if ('speechSynthesis' in window) window.speechSynthesis.resume();

        let pool = [...toeicDatabase];

        // ボリューム絞り込み
        if (toeicVolumeFilter !== 'ALL') {
          const volNum = parseInt(toeicVolumeFilter);
          pool = pool.filter(q => q.vol === volNum);
        }

        // Part絞り込み
        if (toeicCategory !== 'ALL') {
          const partNum = parseInt(toeicCategory);
          pool = pool.filter(q => q.part === partNum);
        }

        if (pool.length === 0) {
          alert("該当する問題がありません。フィルター条件を変更してください。");
          return;
        }

        const todayStr = new Date().toISOString().split('T')[0];

        if (srsOnly) {
          const dueQuestions = pool.filter(q => toeicRecords[q.id] && toeicRecords[q.id].nextReviewDate <= todayStr);
          if (dueQuestions.length === 0) {
            alert("本日復習期日の問題はありません！新しい問題を進めましょう。");
            return;
          }
          setQuizQueue(shuffleArray(dueQuestions).slice(0, 15));
        } else {
          const dueQuestions = pool.filter(q => toeicRecords[q.id] && toeicRecords[q.id].nextReviewDate <= todayStr);
          const unlearned = pool.filter(q => !toeicRecords[q.id]);
          const future = pool.filter(q => toeicRecords[q.id] && toeicRecords[q.id].nextReviewDate > todayStr);

          const orderedPool = [
            ...shuffleArray(dueQuestions),
            ...shuffleArray(unlearned),
            ...shuffleArray(future)
          ];
          const selected = orderedPool.slice(0, Math.min(toeicQuestionCount, orderedPool.length));
          setQuizQueue(selected);
        }

        setCurrentIndex(0);
        setSessionCorrectCount(0);
        setUserAnswer('');
        setCurrentResult(null);
        setIsTranslationOpen(false);
        setActiveMode('toeic');
        setScreen('quiz');
      };

      const currentQuestion = quizQueue[currentIndex];

      const blankedDailyPhrase = useMemo(() => {
        if (!currentQuestion || activeMode !== 'daily') return '';
        const target = currentQuestion.target || currentQuestion.word;
        const regex = new RegExp(`(${target.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        return currentQuestion.phrase.replace(regex, '[ ______ ]');
      }, [currentQuestion, activeMode]);

      const dailyChoices = useMemo(() => {
        if (!currentQuestion || activeMode !== 'daily' || answerMode !== 'choice') return [];
        const correct = currentQuestion.word;
        const others = DAILY_MASTER_DATA.filter(w => w.word.toLowerCase() !== correct.toLowerCase()).map(w => w.word);
        const shuffledOthers = shuffleArray(Array.from(new Set(others)));
        return shuffleArray([correct, ...shuffledOthers.slice(0, 3)]);
      }, [currentQuestion, activeMode, answerMode]);

      const getCorrectWordText = (q) => {
        if (!q) return '';
        if (activeMode === 'daily') return q.word;
        const ansChar = (q.answer || 'A').trim().charAt(0).toUpperCase();
        const matched = (q.options || []).find(opt => opt.trim().toUpperCase().startsWith(ansChar));
        if (matched) {
          return matched.replace(/^[A-D][\.\)\s]\s*/i, '').trim();
        }
        return q.answer || '';
      };

      const filledFullEnglishSentence = useMemo(() => {
        if (!currentQuestion) return '';
        if (activeMode === 'daily') return currentQuestion.phrase;

        const correctWord = getCorrectWordText(currentQuestion);
        if (currentQuestion.part === 5) {
          return currentQuestion.question.replace(/-------|______|____|\[\s*______\s*\]/g, `[${correctWord}]`);
        } else if (currentQuestion.part === 6) {
          const matchNum = currentQuestion.question.match(/\[\s*(\d+)\s*\]/);
          if (matchNum && currentQuestion.passage) {
            return currentQuestion.passage.replace(matchNum[0], `[★ ${correctWord} ★]`);
          }
          return currentQuestion.question.replace(/\[\s*.*?\s*\]/g, `[${correctWord}]`);
        } else {
          return currentQuestion.question;
        }
      }, [currentQuestion, activeMode]);

      const extractedVocabList = useMemo(() => {
        if (!currentQuestion || activeMode !== 'toeic') return [];
        const textToScan = `${currentQuestion.passage || ''} ${currentQuestion.question || ''} ${currentQuestion.explanation || ''}`.toLowerCase();
        const found = [];

        Object.keys(MASTER_VOCAB_DICT).forEach(key => {
          if (textToScan.includes(key.toLowerCase())) {
            found.push({
              word: key,
              ...MASTER_VOCAB_DICT[key]
            });
          }
        });
        return found;
      }, [currentQuestion, activeMode]);

      const handleAnswerSubmit = (isCorrect, chosenOptionText = '') => {
        const today = new Date();
        const todayStr = today.toISOString().split('T')[0];

        if (activeMode === 'daily') {
          const currentRec = dailyRecords[currentQuestion.id] || { streak: 0 };
          let newStreak = isCorrect ? currentRec.streak + 1 : 0;
          let nextDays = isCorrect ? SRS_INTERVALS[Math.min(newStreak - 1, SRS_INTERVALS.length - 1)] : 1;

          if (isCorrect) setSessionCorrectCount(p => p + 1);

          const nextDate = new Date();
          nextDate.setDate(today.getDate() + nextDays);

          const updated = {
            ...dailyRecords,
            [currentQuestion.id]: {
              streak: newStreak,
              lastLearnedDate: todayStr,
              nextReviewDate: nextDate.toISOString().split('T')[0]
            }
          };
          setDailyRecords(updated);
          try {
            localStorage.setItem(STORAGE_KEY_SRS_DAILY, JSON.stringify(updated));
          } catch (e) {}

          speakText(currentQuestion.phrase);
        } else {
          const currentRec = toeicRecords[currentQuestion.id] || { streak: 0 };
          let newStreak = isCorrect ? currentRec.streak + 1 : 0;
          let nextDays = isCorrect ? SRS_INTERVALS[Math.min(newStreak - 1, SRS_INTERVALS.length - 1)] : 1;

          if (isCorrect) setSessionCorrectCount(p => p + 1);

          const nextDate = new Date();
          nextDate.setDate(today.getDate() + nextDays);

          const updatedToeic = {
            ...toeicRecords,
            [currentQuestion.id]: {
              streak: newStreak,
              lastLearnedDate: todayStr,
              nextReviewDate: nextDate.toISOString().split('T')[0]
            }
          };
          setToeicRecords(updatedToeic);
          try {
            localStorage.setItem(STORAGE_KEY_SRS_TOEIC, JSON.stringify(updatedToeic));
          } catch (e) {}
        }

        setCurrentResult({ isCorrect, question: currentQuestion, chosenOption: chosenOptionText });
        setIsTranslationOpen(false);
        setScreen('explanation');
      };

      const handleNextQuestion = () => {
        if (currentIndex + 1 < quizQueue.length) {
          setCurrentIndex(p => p + 1);
          setUserAnswer('');
          setShowMentalAnswer(false);
          setCurrentResult(null);
          setIsTranslationOpen(false);
          setScreen('quiz');
        } else {
          setScreen('result');
        }
      };

      return (
        <div className="min-h-[100dvh] flex flex-col items-center justify-start sm:justify-center p-3 sm:p-5">
          <div className="w-full max-w-xl bg-white rounded-3xl shadow-xl border border-slate-200/80 overflow-hidden flex flex-col my-auto transition-all">

            {/* 1. モード選択トップ画面 */}
            {screen === 'mode-select' && (
              <div className="p-6 sm:p-8 space-y-6">
                <div className="text-center pt-2">
                  <div className="w-14 h-14 bg-gradient-to-tr from-blue-600 to-indigo-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl shadow-lg shadow-blue-100">
                    🏆
                  </div>
                  <h1 className="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">
                    SRS 忘却曲線 英語マスター
                  </h1>
                  <p className="text-xs text-slate-500 font-medium mt-1">
                    全392問 完全内蔵・iPhone即時学習対応
                  </p>
                </div>

                <div className="grid grid-cols-1 gap-4 pt-1">
                  <button
                    onClick={() => {
                      setActiveMode('toeic');
                      setScreen('toeic-home');
                    }}
                    className="p-5 rounded-2xl border-2 border-blue-200 bg-gradient-to-br from-blue-50/60 to-white hover:border-blue-600 hover:shadow-md transition-all text-left flex items-center justify-between group active:scale-[0.99]"
                  >
                    <div className="flex items-center gap-4">
                      <div className="w-12 h-12 rounded-xl bg-blue-600 text-white flex items-center justify-center text-xl shadow-md shadow-blue-200">
                        📝
                      </div>
                      <div>
                        <div className="flex items-center gap-2">
                          <span className="text-base font-black text-slate-900 group-hover:text-blue-600 transition-colors">
                            TOEICの実戦問題（Part 5 / 6 / 7）
                          </span>
                          <span className="bg-blue-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded">
                            392問
                          </span>
                        </div>
                        <div className="text-xs text-slate-500 font-medium mt-0.5">
                          Part 6 & Part 7 詳細解説・単語帳カード完全連動
                        </div>
                      </div>
                    </div>
                    <span className="text-blue-600 text-lg font-bold group-hover:translate-x-1 transition-transform">→</span>
                  </button>

                  <button
                    onClick={() => {
                      setActiveMode('daily');
                      setScreen('daily-home');
                    }}
                    className="p-5 rounded-2xl border-2 border-indigo-100 bg-gradient-to-br from-indigo-50/40 to-white hover:border-indigo-600 hover:shadow-md transition-all text-left flex items-center justify-between group active:scale-[0.99]"
                  >
                    <div className="flex items-center gap-4">
                      <div className="w-12 h-12 rounded-xl bg-indigo-600 text-white flex items-center justify-center text-xl shadow-md shadow-indigo-200">

                        <div className="text-base font-black text-slate-900 group-hover:text-indigo-600 transition-colors">

                    </div>
                    <span className="text-indigo-600 text-lg font-bold group-hover:translate-x-1 transition-transform">→</span>
                  </button>
                </div>
              </div>
            )}

            {/* 2-B. TOEIC 問題 設定画面 */}
            {screen === 'toeic-home' && (
              <div className="p-5 sm:p-7 space-y-5">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <button
                    onClick={() => setScreen('mode-select')}
                    className="text-xs font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1"
                  >
                    ← トップに戻る
                  </button>
                  <span className="text-xs font-black text-blue-700 bg-blue-50 px-2.5 py-1 rounded-full border border-blue-200">
                    完全内蔵: 全{toeicDatabase.length}問
                  </span>
                </div>

                {/* 忘却曲線（SRS）学習ステータス */}
                <div className="grid grid-cols-3 gap-2">
                  <div className="bg-amber-50/80 border border-amber-200/80 p-3 rounded-2xl text-center">
                    <div className="text-[10px] font-bold text-amber-700">本日復習期日</div>
                    <div className="text-xl sm:text-2xl font-black text-amber-900 mt-0.5">
                      {toeicSrsStats.reviewDueCount} <span className="text-[10px] text-amber-700">問</span>
                    </div>

                      <button
                        onClick={() => speakText(currentResult.question.word)}
                        className="px-2.5 py-1.5 bg-white border border-slate-200 text-slate-700 font-bold rounded-lg text-xs"
                      >
                        単語
                      </button>
                    )}
                  </div>
                </div>

                {/* 解説カード */}
                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3 text-left">
                  {/* 日常単語の解説 */}
                  {activeMode === 'daily' && (
                    <div>
                      <div className="text-[10px] font-bold text-indigo-600 uppercase">正解の英単語</div>
                      <div className="text-2xl font-black text-slate-900 mt-0.5">{currentResult.question.word}</div>
                      <div className="text-xs font-semibold text-slate-600 mt-0.5">{currentResult.question.meaning}</div>
                    </div>
                  )}

                  {/* TOEICの解説（文法・語彙ロジック & 単語帳解説） */}
                  {activeMode === 'toeic' && (
                    <div>
                      <div className="text-xs font-black text-blue-600 mb-1 flex items-center gap-1">
                        <span>💡</span> 解説（Explanation）
                      </div>
                      <div className="text-xs sm:text-sm text-slate-700 leading-relaxed font-medium whitespace-pre-line bg-white p-3 rounded-xl border border-slate-200">
                        {currentResult.question.explanation || '解説情報がありません。'}
                      </div>
                    </div>
                  )}

                  {/* ノート重要語彙・熟語カード */}
                  {activeMode === 'toeic' && extractedVocabList.length > 0 && (
                    <div className="pt-2 border-t border-slate-200">
                      <div className="text-[11px] font-black text-amber-700 uppercase tracking-wider mb-2 flex items-center gap-1">
                        <span>📚</span>
                        <span>長文・設問中の重要語彙・熟語（単語帳抽出カード）</span>
                      </div>
                      <div className="space-y-1.5">
                        {extractedVocabList.map((item, idx) => (
                          <div key={idx} className="bg-amber-50/60 border border-amber-200/80 rounded-xl p-2.5 flex items-start justify-between gap-2">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="font-black text-xs text-amber-950">{item.word}</span>
                                <span className="text-[10px] bg-amber-200/60 text-amber-900 font-bold px-1.5 py-0.5 rounded">
                                  {item.part}
                                </span>
                              </div>
                              <div className="text-xs text-amber-900 font-bold mt-0.5">
                                {item.meaning}
                              </div>
                              {item.note && (
                                <div className="text-[10px] text-amber-700 mt-0.5 font-medium">
                                  📌 {item.note}
                                </div>
                              )}
                            </div>
                            <button
                              onClick={() => speakText(item.word)}
                              className="p-1 text-amber-700 hover:text-amber-900 active:scale-95 text-xs"
                              title="単語を発音"
                            >
                              🔊
                            </button>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {/* 日本語訳アコーディオン */}
                  <div className="border border-slate-200 rounded-xl overflow-hidden bg-white mt-2">
                    <button
                      onClick={() => setIsTranslationOpen(!isTranslationOpen)}
                      className="w-full text-left px-3.5 py-2.5 flex justify-between items-center text-xs font-bold text-slate-700 hover:bg-slate-50 transition"
                    >
                      <span className="flex items-center gap-1.5">
                        <span>🌐</span>
                        <span>日本語訳を確認する（{isTranslationOpen ? '閉じる' : 'タップで表示'}）</span>
                      </span>
                      <span className={`transform transition-transform text-slate-400 ${isTranslationOpen ? 'rotate-180' : ''}`}>▼</span>
                    </button>
                    {isTranslationOpen && (
                      <div className="p-3.5 bg-slate-50 border-t border-slate-100 text-xs text-slate-600 leading-relaxed space-y-3">
                        {activeMode === 'daily' ? (
                          <div>
                            <div className="font-bold text-slate-800 mb-1">【フレーズ訳】</div>
                            <div className="mb-2">{currentResult.question.phraseJa}</div>
                            <div className="font-bold text-slate-800 mb-1">【例文訳】</div>
                            <div>{currentResult.question.otherPhraseJa}</div>
                          </div>
                        ) : (
                          <div>
                            {currentResult.question.passage && (
                              <div className="mb-3 pb-3 border-b border-slate-200">
                                <div className="font-black text-blue-700 mb-1 flex items-center gap-1">
                                  <span>📖</span> 長文全体の和文（全訳）:
                                </div>
                                <div className="text-slate-800 whitespace-pre-line bg-white p-3 rounded-xl border border-slate-200 leading-relaxed">
                                  {currentResult.question.passageJa || currentResult.question.translation.split('\n\n')[0] || '長文の全訳があります。'}
                                </div>
                              </div>
                            )}

                            <div>
                              <div className="font-black text-slate-700 mb-1">
                                📝 設問・選択肢の和訳:
                              </div>
                              <div className="whitespace-pre-line text-slate-700 font-medium">
                                {currentResult.question.translation || '日本語訳情報がありません。'}
                              </div>
                            </div>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                </div>

                <button
                  onClick={handleNextQuestion}
                  className="w-full py-4 bg-slate-900 active:bg-slate-800 text-white font-black rounded-2xl text-sm shadow-lg transition-all"
                >
                  {currentIndex + 1 < quizQueue.length ? '次の問題へ進む' : '結果を見る'}
                </button>
              </div>
            )}

            {/* 5. 結果サマリー画面 */}
            {screen === 'result' && (
              <div className="p-6 sm:p-8 text-center space-y-5">
                <div className="w-14 h-14 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto text-3xl shadow-inner">
                  🎉
                </div>
                <div>
                  <h2 className="text-xl sm:text-2xl font-black text-slate-900">演習セッション完了！</h2>
                  <p className="text-xs text-slate-500 mt-0.5">
                    {activeMode === 'daily' 
                      ? '日常単語の忘却曲線（SRS）スケジュールが更新されました' 
                      : 'TOEIC問題の忘却曲線インターバルが更新されました'}
                  </p>
                </div>

                <div className="bg-slate-50 border border-slate-200 rounded-2xl p-4 sm:p-5">
                  <div className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">正答率</div>
                  <div className="text-4xl sm:text-5xl font-black text-blue-600">
                    {Math.round((sessionCorrectCount / quizQueue.length) * 100)}%
                  </div>
                  <div className="text-xs text-slate-500 font-bold mt-1">
                    {quizQueue.length} 問中 {sessionCorrectCount} 問 正解
                  </div>
                </div>

                <div className="space-y-2 pt-2">
                  <button
                    onClick={() => setScreen(activeMode === 'daily' ? 'daily-home' : 'toeic-home')}
                    className="w-full py-3.5 bg-blue-600 active:bg-blue-700 text-white font-black rounded-2xl text-sm shadow-md transition-all"
                  >
                    同じモードで再挑戦する
                  </button>
                  <button
                    onClick={() => setScreen('mode-select')}
                    className="w-full py-3.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-2xl text-sm transition-all"
                  >
                    モード選択（トップ）に戻る
                  </button>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
